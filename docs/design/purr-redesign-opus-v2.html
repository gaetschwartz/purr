}
function toggleSw(key, b) {
  const on = b.getAttribute("aria-checked") !== "true";
  b.setAttribute("aria-checked", on);
  if (key === "rt") { S.rt = on; applyGlobal(); saved(); syncDemo(); return; }
  if (key === "showTs") { S.showTs = on; render(); return; }
  if (key === "autoscroll") { S.autoscroll = on; after(); return; }
  S.settings[key] = on; saved();
  if (key === "gpu" || key === "concurrent") render();
}
function step(key, d) {
  const s = S.settings, lim = { maxTokens: [32, 448, 32], threads: [0, 24, 1], jobs: [1, 8, 1] }[key];
  s[key] = Math.max(lim[0], Math.min(lim[1], s[key] + d * lim[2])); render(); saved();
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.range === "temp") { S.settings.temp = +t.value; t.style.setProperty("--p", t.value * 100 + "%"); $("#temp-val").textContent = (+t.value).toFixed(1); t.setAttribute("aria-valuetext", (+t.value).toFixed(1)); saved(); }
  if (t.id === "t-search") { S.q = t.value; S.qi = 0; render(); }
  if (t.id === "m-search") { S.mQ = t.value; render(); }
  if (t.id === "l-search") { S.logQ = t.value; render(); }
  if (t.id === "h-search") { const q = t.value.toLowerCase(); $$("#hlist .hrow").forEach(r => { const h = S.history.find(x => x.id === r.dataset.hid); r.hidden = q && !(h.name + h.segs.map(s => s[1]).join(" ")).toLowerCase().includes(q); }); }
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset.sel) { S.settings[t.dataset.sel] = t.value; saved(); if (t.dataset.sel === "logLevel" && S.view === "logs") render(); } });
$("#file-input").addEventListener("change", e => { const f = e.target.files[0]; if (f) pickFile(f); e.target.value = ""; });

/* Drag and drop (whole app accepts a drop; the drop zone shows the affordance) */
const app = $("#app");
["dragenter", "dragover"].forEach(ev => app.addEventListener(ev, e => { if (S.view !== "transcribe" || !["idle", "ready"].includes(S.phase)) return; e.preventDefault(); $("#drop")?.classList.add("over"); }));
app.addEventListener("dragleave", e => { if (!app.contains(e.relatedTarget)) $("#drop")?.classList.remove("over"); });
app.addEventListener("drop", e => { e.preventDefault(); $("#drop")?.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f && S.view === "transcribe") pickFile(f); });
window.addEventListener("dragover", e => e.preventDefault()); window.addEventListener("drop", e => e.preventDefault());

/* Keyboard */
document.addEventListener("keydown", e => {
  const L = $("#layer");
  if (L.classList.contains("open")) {
    if (e.key === "Escape") { e.preventDefault(); closeLayer(); return; }
    if (e.key === "Tab") { const f = $$("#layer-body button:not([disabled]), #layer-body input, #layer-body select, #layer-body [tabindex='0']").filter(x => x.offsetParent); if (!f.length) return; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
    if (["ArrowDown", "ArrowUp"].includes(e.key) && document.activeElement.closest(".plist") && document.activeElement.id !== "lang-q") { const o = $$("#layer-body .opt"); const i = o.indexOf(document.activeElement); if (i > -1) { e.preventDefault(); o[(i + (e.key === "ArrowDown" ? 1 : -1) + o.length) % o.length].focus(); } }
    return;
  }
  const r = e.target.closest && e.target.closest("[data-seg] [role=radio]");
  if (r && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
    e.preventDefault(); const all = $$("[role=radio]", r.parentElement); const i = all.indexOf(r) + (["ArrowRight", "ArrowDown"].includes(e.key) ? 1 : -1); const n = all[(i + all.length) % all.length]; n.focus(); n.click(); return;
  }
  if (e.target.id === "wave" && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) { e.preventDefault(); setPos(e.key === "Home" ? 0 : e.key === "End" ? S.current.dur : S.pos + (e.key === "ArrowRight" ? 5 : -5)); return; }
  const mod = e.metaKey || e.ctrlKey, typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (S.page !== "proto" || e.target.closest("#demo")) return;
  if (mod && e.key.toLowerCase() === "o") { e.preventDefault(); go("transcribe", { focus: false }); if (["idle", "ready", "firstrun"].includes(S.phase) && S.phase !== "firstrun") $("#file-input").click(); return; }
  if (mod && e.key.toLowerCase() === "f" && S.view === "transcribe" && S.phase === "result") { e.preventDefault(); $("#t-search").focus(); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === "c" && S.phase === "result") { e.preventDefault(); copyText(exportText("txt"), "Transcript copied", ""); return; }
  if (mod && e.key.toLowerCase() === "e" && S.phase === "result" && S.view === "transcribe") { e.preventDefault(); exportSheet(S.settings.fmt); return; }
  if (mod && e.key === ",") { e.preventDefault(); go("preferences"); return; }
  if (mod && ["1", "2", "3"].includes(e.key)) { e.preventDefault(); go(["transcribe", "history", "models"][+e.key - 1]); return; }
  if (!typing && e.key === "?") { e.preventDefault(); keysSheet(); return; }
  if (!typing && e.key === " " && S.view === "transcribe" && S.phase === "result" && !e.target.closest("button")) { e.preventDefault(); togglePlay(); }
  if (e.key === "Enter" && e.target.id === "t-search") { e.preventDefault(); $("#q-next")?.click(); setTimeout(() => $("#t-search")?.focus(), 0); }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h === "notes") setPage("notes"); else if (TITLES[h] && h !== S.view) { setPage("proto"); go(h, { noHash: true }); } });
window.addEventListener("resize", () => { if (S.view === "transcribe" && S.phase === "result") paintWave(); });

/* ---------------- Page switch (prototype / notes) ---------------- */
function setPage(p) {
  S.page = p;
  $("#proto-view").hidden = p !== "proto"; $("#notes-view").hidden = p !== "notes";
  $("#demo-btn").hidden = p !== "proto"; if (p !== "proto") { $("#demo").hidden = true; $("#demo-btn").setAttribute("aria-expanded", "false"); }
  $$("#page-switch [role=radio]").forEach(b => { b.setAttribute("aria-checked", b.dataset.v === p); b.tabIndex = b.dataset.v === p ? 0 : -1; });
  try { history.replaceState(null, "", "#" + (p === "notes" ? "notes" : S.view)); } catch (e) {}
  if (p === "notes" && !$("#notes-view").innerHTML.trim()) $("#notes-view").innerHTML = $("#notes-tpl").innerHTML;
  if (p === "proto") render();
  window.scrollTo(0, 0);
}

/* ---------------- Demo controls ---------------- */
function clean(keepView) {
  stopRun(); togglePlay(false); closeLayer();
  S.fileError = null; S.noWebGPU = false; S.gpuFallback = false; S.offline = false; S.failNext = false; S.noF16 = false;
  for (const [k, v] of Object.entries(S.dl)) if (v !== "ok") delete S.dl[k];
  S.prog = {}; clearInterval(timers.dl);
  S.dl = { "large-v3-turbo-q5": "ok", "base.en": "ok", "small-q5": "ok" }; S.model = "large-v3-turbo-q5";
  if (!S.history.length) S.history = HISTORY0.slice();
  if (!S.logs.length) S.logs = LOGS0.slice();
  S.q = ""; S.pos = 0;
}
const SAMPLE_FILE = { name: SAMPLE.name, dur: SAMPLE.dur, bytes: SAMPLE.bytes, ext: SAMPLE.ext };
const DEMO = {
  "First run": () => { clean(); S.dl = {}; S.history = []; S.phase = "firstrun"; go("transcribe"); },
  "Idle": () => { clean(); S.file = null; S.phase = "idle"; go("transcribe"); },
  "File chosen": () => { clean(); S.file = { ...SAMPLE_FILE }; S.phase = "ready"; go("transcribe"); },
  "Downloading": () => { clean(); S.phase = "idle"; S.prog["medium-q5"] = { pct: 34, speed: 24 }; S.dl["medium-q5"] = "downloading"; go("models"); tickDownloads(); },
  "Loading model": () => { clean(); S.file = { ...SAMPLE_FILE }; startRun(); },
  "Transcribing": () => { clean(); S.file = { ...SAMPLE_FILE }; startRun(); S.run.stage = 2; S.run.n = 4; S.run.el = 6.5; S.run.pct = 4 / 15 * 100; S.run.speed = 4.6; rerunRender(); },
  "Result": () => { clean(); S.current = S.history[0]; S.phase = "result"; go("transcribe"); },
  "Empty history": () => { clean(); S.history = []; go("history"); },
  "Empty logs": () => { clean(); S.logs = []; go("logs"); }
};
const ERRS = {
  "Unsupported file": () => { clean(); S.phase = "idle"; S.fileError = "type"; go("transcribe"); },
  "Empty file": () => { clean(); S.phase = "idle"; S.fileError = "empty"; go("transcribe"); },
  "Corrupted audio": () => { clean(); S.phase = "idle"; S.fileError = "corrupt"; go("transcribe"); },
  "File too large": () => { clean(); S.phase = "idle"; S.fileError = "big"; go("transcribe"); },
  "No WebGPU": () => { clean(); S.platform = "browser"; S.noWebGPU = true; S.phase = "idle"; go("transcribe"); syncDemo(); },
  "Offline download": () => { clean(); S.prog["medium-q5"] = { pct: 61, speed: 0 }; S.dl["medium-q5"] = "downloading"; S.offline = true; go("models"); tickDownloads(); toast("You're offline", "The download will resume when you reconnect.", "warn", "wifioff"); },
  "Download failed": () => { clean(); S.dl["small"] = "failed"; S.prog["small"] = { pct: 38, speed: 0 }; go("models"); toast("Small didn't finish downloading", "The connection was reset at 38%.", "bad", "xcircle", { label: "Retry", run: () => startDownload("small") }); },
  "Integrity failed": () => { clean(); S.dl["small-q5"] = "corrupt"; go("models"); { const el = $("#mr-small-q5"); if (el) { const sc = $("#scroller"); sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 120; } } },
  "Transcription failed": () => { clean(); S.file = { ...SAMPLE_FILE }; S.phase = "failed"; go("transcribe"); },
  "Cancelled": () => { clean(); S.file = { ...SAMPLE_FILE }; S.phase = "ready"; go("transcribe"); toast("Transcription cancelled", "Nothing was saved. The file is still selected.", "", "info", { label: "Start again", run: startRun }); },
  "GPU fallback": () => { clean(); S.platform = "desktop"; S.gpuFallback = true; S.file = { ...SAMPLE_FILE }; startRun(); S.run.stage = 2; S.run.n = 3; S.run.el = 5; S.run.pct = 20; S.run.speed = 3.9; rerunRender(); toast("CUDA isn't available, using Vulkan", "Purr switched automatically.", "warn", "bolt"); syncDemo(); },
  "Needs GPU feature": () => { clean(); S.noF16 = true; go("models"); { const el = $("#mr-large-v3"); if (el) { const sc = $("#scroller"); sc.scrollTop += el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 120; } } }
};
function demoHTML() {
  const b = (grp, k, pressed) => `<button class="d" data-dg="${grp}" data-dk="${esc(k)}" aria-pressed="${!!pressed}">${k}</button>`;
  return `<div class="top"><b>Demo controls</b><button class="x" id="demo-x" aria-label="Close demo controls">${ic("x", "sm")}</button></div>
  <p class="note">Not part of the design. Flips the prototype between states.</p>
  <h4>Flow</h4><div class="opts">${Object.keys(DEMO).map(k => b("flow", k)).join("")}</div>
  <h4>Errors and edge cases</h4><div class="opts">${Object.keys(ERRS).map(k => b("err", k)).join("")}</div>
  <h4>Platform</h4><div class="opts">${b("plat", "Desktop", S.platform === "desktop")}${b("plat", "Browser", S.platform === "browser")}</div>
  <h4>Theme</h4><div class="opts">${["System", "Light", "Dark"].map(t => b("theme", t, S.theme === t.toLowerCase())).join("")}</div>
  <h4>Accessibility</h4><div class="opts">${b("rt", "Reduce transparency", S.rt)}${b("rm", "Reduce motion", S.rm)}</div>
  <h4>Viewport</h4><div class="opts">${[["fit", "Fit window"], ["desktop", "Desktop 1280"], ["tablet", "Tablet 820"], ["phone", "Phone 390"]].map(([v, l]) => `<button class="d" data-dg="vp" data-dk="${v}" aria-pressed="${S.vp === v}">${l}</button>`).join("")}</div>`;
}
function syncDemo() { const d = $("#demo"); if (!d.hidden) { const f = document.activeElement; const k = f && f.dataset && f.dataset.dk; d.innerHTML = demoHTML(); if (k) d.querySelector(`[data-dk="${CSS.escape(k)}"]`)?.focus(); } }
$("#demo-btn").addEventListener("click", () => { const d = $("#demo"); d.hidden = !d.hidden; $("#demo-btn").setAttribute("aria-expanded", !d.hidden); if (!d.hidden) { d.innerHTML = demoHTML(); d.querySelector("button.d")?.focus(); } });
$("#demo").addEventListener("click", e => {
  if (e.target.closest("#demo-x")) { $("#demo").hidden = true; $("#demo-btn").setAttribute("aria-expanded", "false"); $("#demo-btn").focus(); return; }
  const b = e.target.closest("[data-dg]"); if (!b) return;
  const g = b.dataset.dg, k = b.dataset.dk;
  if (g === "flow") DEMO[k]();
  if (g === "err") ERRS[k]();
  if (g === "plat") { S.platform = k.toLowerCase(); if (S.platform === "desktop") S.noWebGPU = false; render(); }
  if (g === "theme") { setTheme(k.toLowerCase()); if (S.view === "preferences") render(); }
  if (g === "rt") { S.rt = !S.rt; render(); }
  if (g === "rm") { S.rm = !S.rm; applyGlobal(); }
  if (g === "vp") { S.vp = k; applyGlobal(); setTimeout(() => { if (S.phase === "result") paintWave(); }, 550); }

});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#demo").hidden && e.target.closest("#demo")) { $("#demo").hidden = true; $("#demo-btn").setAttribute("aria-expanded", "false"); $("#demo-btn").focus(); } });

/* expose for testing */
window.__purr = { S, go, DEMO, ERRS, render, setPage };

/* ---------------- Boot ---------------- */
{ const t0 = document.documentElement.getAttribute("data-theme"); S.theme = t0 === "dark" || t0 === "light" ? t0 : "system"; }
const h0 = location.hash.slice(1);
if (h0 === "notes") setPage("notes"); else { if (TITLES[h0]) S.view = h0; render(); }
})();
</script>
