<title>Purr: redesign proposal v2 (Opus 5.5)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a framed app window (container-queried) floating over a calm page; demo controls live outside the frame. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;

  --page:#E6E8F0;
  --page-fg:#16171F;
  --base:#EDEFF6;
  --blob-1:#7C7DFF;
  --blob-2:#C9A2FF;
  --blob-3:#86D9EA;
  --blob-4:#FFC9AE;
  --blob-alpha:.62;

  --fg:#16171F;
  --fg-2:#4D4E60;
  --fg-3:#5C5D6F;
  --fg-4:#8C8D9D;
  --accent:#4B4FE0;
  --accent-hover:#3F43D0;
  --accent-text:#3E42CC;
  --accent-on:#FFFFFF;
  --accent-soft:rgba(75,79,224,.12);
  --accent-soft-2:rgba(75,79,224,.20);
  --success:#1B7F47;
  --success-soft:rgba(39,170,94,.14);
  --warning:#965500;
  --warning-soft:rgba(240,150,20,.16);
  --danger:#C8263A;
  --danger-soft:rgba(222,46,66,.12);
  --mark:rgba(255,196,0,.42);

  --glass-1:rgba(255,255,255,.56);
  --glass-2:rgba(255,255,255,.68);
  --glass-3:rgba(251,251,255,.84);
  --solid-1:#F3F4F9;
  --solid-2:#FFFFFF;
  --solid-3:#FFFFFF;
  --row:rgba(255,255,255,.0);
  --fill:rgba(118,120,150,.12);
  --fill-2:rgba(118,120,150,.18);
  --fill-hover:rgba(118,120,150,.10);
  --switch-off:rgba(118,120,150,.30);
  --switch-on:#2FB45A;
  --seg-on:#FFFFFF;
  --edge:rgba(255,255,255,.78);
  --edge-low:rgba(255,255,255,.30);
  --hairline:rgba(22,24,46,.08);
  --separator:rgba(22,24,46,.10);
  --spec:inset 0 1px 0 rgba(255,255,255,.85);
  --shadow-1:0 1px 2px rgba(24,26,60,.05),0 6px 20px -8px rgba(24,26,60,.14);
  --shadow-2:0 2px 6px rgba(24,26,60,.06),0 18px 48px -18px rgba(24,26,60,.26);
  --shadow-3:0 4px 12px rgba(24,26,60,.08),0 30px 80px -24px rgba(24,26,60,.38);
  --scrim:rgba(20,22,40,.24);
  --blur:28px;
  --sat:180%;

  --r-window:28px;
  --r-panel:20px;
  --r-card:22px;
  --r-inner:14px;
  --r-control:10px;
  --ease-spring:cubic-bezier(.32,1.28,.54,1);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#06070C;--page-fg:#F2F3FA;--base:#0B0D18;
  --blob-1:#4A46D8;--blob-2:#7C45C9;--blob-3:#0F6E83;--blob-4:#9A4A70;--blob-alpha:.55;
  --fg:#F2F3FA;--fg-2:#B5B7CA;--fg-3:#9799AF;--fg-4:#6C6E84;
  --accent:#5D60F0;--accent-hover:#6E71F5;--accent-text:#A9AAFF;--accent-on:#FFFFFF;
  --accent-soft:rgba(125,127,255,.18);--accent-soft-2:rgba(125,127,255,.28);
  --success:#5BD38C;--success-soft:rgba(70,200,120,.16);--warning:#F5B44A;--warning-soft:rgba(245,170,50,.16);
  --danger:#FF7383;--danger-soft:rgba(255,90,110,.16);--mark:rgba(255,200,40,.34);
  --glass-1:rgba(26,28,44,.56);--glass-2:rgba(32,34,52,.62);--glass-3:rgba(36,38,58,.82);
  --solid-1:#141627;--solid-2:#1B1D31;--solid-3:#222439;
  --fill:rgba(140,142,180,.16);--fill-2:rgba(140,142,180,.24);--fill-hover:rgba(140,142,180,.12);--switch-off:rgba(140,142,180,.34);--switch-on:#34C468;--seg-on:#5A5C74;
  --edge:rgba(255,255,255,.14);--edge-low:rgba(255,255,255,.06);--hairline:rgba(255,255,255,.07);--separator:rgba(255,255,255,.09);
  --spec:inset 0 1px 0 rgba(255,255,255,.08);
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-2:0 2px 6px rgba(0,0,0,.3),0 20px 50px -18px rgba(0,0,0,.6);
  --shadow-3:0 4px 12px rgba(0,0,0,.35),0 30px 80px -20px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#06070C;--page-fg:#F2F3FA;--base:#0B0D18;
  --blob-1:#4A46D8;--blob-2:#7C45C9;--blob-3:#0F6E83;--blob-4:#9A4A70;--blob-alpha:.55;
  --fg:#F2F3FA;--fg-2:#B5B7CA;--fg-3:#9799AF;--fg-4:#6C6E84;
  --accent:#5D60F0;--accent-hover:#6E71F5;--accent-text:#A9AAFF;--accent-on:#FFFFFF;
  --accent-soft:rgba(125,127,255,.18);--accent-soft-2:rgba(125,127,255,.28);
  --success:#5BD38C;--success-soft:rgba(70,200,120,.16);--warning:#F5B44A;--warning-soft:rgba(245,170,50,.16);
  --danger:#FF7383;--danger-soft:rgba(255,90,110,.16);--mark:rgba(255,200,40,.34);
  --glass-1:rgba(26,28,44,.56);--glass-2:rgba(32,34,52,.62);--glass-3:rgba(36,38,58,.82);
  --solid-1:#141627;--solid-2:#1B1D31;--solid-3:#222439;
  --fill:rgba(140,142,180,.16);--fill-2:rgba(140,142,180,.24);--fill-hover:rgba(140,142,180,.12);--switch-off:rgba(140,142,180,.34);--switch-on:#34C468;--seg-on:#5A5C74;
  --edge:rgba(255,255,255,.14);--edge-low:rgba(255,255,255,.06);--hairline:rgba(255,255,255,.07);--separator:rgba(255,255,255,.09);
  --spec:inset 0 1px 0 rgba(255,255,255,.08);
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-2:0 2px 6px rgba(0,0,0,.3),0 20px 50px -18px rgba(0,0,0,.6);
  --shadow-3:0 4px 12px rgba(0,0,0,.35),0 30px 80px -20px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.45);
  color-scheme:dark}

/* Reduced transparency: in-app switch, OS preference, or no backdrop-filter support */
.rt .app{--glass-1:var(--solid-1);--glass-2:var(--solid-2);--glass-3:var(--solid-3);--blob-alpha:0}
@media (prefers-reduced-transparency:reduce){.app{--glass-1:var(--solid-1);--glass-2:var(--solid-2);--glass-3:var(--solid-3);--blob-alpha:0}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.app{--glass-1:var(--solid-1);--glass-2:var(--solid-2);--glass-3:var(--solid-3)}}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--page-fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:28px;height:28px;stroke-width:1.5}
svg.i.xl{width:40px;height:40px;stroke-width:1.3}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.app :focus-visible{outline-color:var(--accent-text)}

/* ---------- Outer page ---------- */
.page-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1440px;margin:0 auto;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--fg-3)}
.page-head .spacer{flex:1}
.stage{max-width:1440px;margin:0 auto;padding-block:0 32px;display:flex;justify-content:center}
.frame{width:100%;max-width:100%;height:clamp(600px,calc(100vh - 92px),920px);transition:width .5s var(--ease-out),height .5s var(--ease-out)}
.frame[data-vp="desktop"]{width:1280px;height:820px}
.frame[data-vp="tablet"]{width:820px;height:1000px}
.frame[data-vp="phone"]{width:390px;height:820px}
.frame[data-vp="phone"] .app{border-radius:46px;box-shadow:0 0 0 10px #15161c,0 0 0 11px #2a2b33,var(--shadow-3)}
@media (max-width:560px){.frame,.frame[data-vp]{height:calc(100vh - 118px);min-height:560px}}

/* ---------- App window ---------- */
.app{position:relative;height:100%;border-radius:var(--r-window);overflow:hidden;container-type:inline-size;container-name:app;background:var(--base);color:var(--fg);
  box-shadow:var(--shadow-3),0 0 0 1px var(--hairline);isolation:isolate}
.ambient{position:absolute;inset:-10%;z-index:0;pointer-events:none;opacity:var(--blob-alpha);transition:opacity .4s}
.blob{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.b1{width:46%;height:52%;left:6%;top:4%;background:var(--blob-1);animation:drift1 38s ease-in-out infinite alternate}
.b2{width:40%;height:46%;right:4%;top:10%;background:var(--blob-2);animation:drift2 44s ease-in-out infinite alternate}
.b3{width:44%;height:42%;left:30%;bottom:2%;background:var(--blob-3);animation:drift3 52s ease-in-out infinite alternate}
.b4{width:30%;height:32%;right:10%;bottom:10%;background:var(--blob-4);animation:drift1 60s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12%,10%) scale(1.08)}}
@keyframes drift2{to{transform:translate(-14%,12%) scale(.94)}}
@keyframes drift3{to{transform:translate(10%,-12%) scale(1.06)}}

.glass{background:var(--glass-2);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:1px solid var(--edge-low);box-shadow:var(--spec),var(--shadow-1);position:relative}
.glass::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(180deg,var(--edge),transparent 42%,transparent 70%,var(--edge-low));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.g1{background:var(--glass-1)} .g3{background:var(--glass-3);box-shadow:var(--spec),var(--shadow-3)}
.rt .glass{-webkit-backdrop-filter:none;backdrop-filter:none}
.rt .glass::before{display:none}
.rt .glass{border-color:var(--separator)}

.shell{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.sidebar{margin:10px 0 10px 10px;border-radius:calc(var(--r-window) - 10px);display:flex;flex-direction:column;padding:14px 10px 10px;gap:2px;background:var(--glass-1);min-height:0}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side-brand b{font-family:var(--font-display);font-size:17px;letter-spacing:-.02em;font-weight:650}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:10px;color:var(--fg);font-size:14px;font-weight:500;width:100%;text-align:left;transition:background .2s}
.nav-item svg{color:var(--fg-2)}
.nav-item:hover{background:var(--fill-hover)}
.nav-item[aria-current="page"]{background:var(--accent-soft-2);color:var(--accent-text)}
.nav-item[aria-current="page"] svg{color:var(--accent-text)}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--fg-3);font-weight:500}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.privacy-pill{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--fill-hover);font-size:12px;color:var(--fg-2);line-height:1.4;margin-top:8px;text-align:left;width:100%}
.privacy-pill svg{color:var(--success);margin-top:1px}
.privacy-pill b{display:block;color:var(--fg);font-weight:600;font-size:12.5px}

.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.scroller{scrollbar-width:thin;flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scroll-behavior:smooth;overscroll-behavior:contain}
.content{max-width:880px;margin:0 auto;padding:28px 32px 48px;display:flex;flex-direction:column;gap:20px}
.content.wide{max-width:1040px}
.topbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.topbar .titles{flex:1;min-width:0}
h1.lt{font-family:var(--font-display);font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.025em;margin:0;text-wrap:balance}
.sub{color:var(--fg-2);font-size:14px;margin:4px 0 0}
h2.t2{font-family:var(--font-display);font-size:20px;line-height:26px;font-weight:650;letter-spacing:-.015em;margin:0}
.t3{font-size:16px;line-height:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.foot{font-size:12.5px;color:var(--fg-3);line-height:1.45}

.tabbar{display:none}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.saved svg{color:var(--success)}

/* ---------- Generic components ---------- */
.card{border-radius:var(--r-card);padding:20px}
.card.tight{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;
  transition:transform .35s var(--ease-spring),background .2s,box-shadow .2s;background:var(--fill);color:var(--fg)}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-on);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px -6px var(--accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.lg{height:44px;padding:0 22px;font-size:15px}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.plain{background:none;color:var(--accent-text);padding:0 8px}
.btn.plain:hover{background:var(--accent-soft)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.icon-btn{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:var(--fg-2);transition:background .2s,transform .35s var(--ease-spring)}
.icon-btn:hover{background:var(--fill)}
.icon-btn:active{transform:scale(.92)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--fill);color:var(--fg-2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent-text)}
.chip.ok{background:var(--success-soft);color:var(--success)}
.chip.warn{background:var(--warning-soft);color:var(--warning)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip svg{width:13px;height:13px}

/* Picker pills */
.pill{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--fill);text-align:left;transition:background .2s,transform .35s var(--ease-spring);max-width:100%}
.pill:hover{background:var(--fill-2)}
.pill:active{transform:scale(.98)}
.pill .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.pill .lbl{font-size:11px;color:var(--fg-3);font-weight:500;line-height:1.2;display:block}
.pill .val{font-size:14px;font-weight:600;line-height:1.25;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .chev{color:var(--fg-3);margin-left:2px}

/* Switch */
.switch{width:51px;height:31px;border-radius:999px;background:var(--switch-off);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);transition:transform .4s var(--ease-spring),width .2s}
.switch:active::after{width:31px}
.switch[aria-checked="true"]{background:var(--switch-on)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[aria-checked="true"]:active::after{transform:translateX(16px)}
.switch[disabled]{opacity:.4;pointer-events:none}

/* Segmented control */
.seg{display:inline-flex;padding:2px;border-radius:10px;background:var(--fill);position:relative;gap:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:28px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .25s,box-shadow .25s}
.seg button[aria-checked="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}

/* Stepper */
.stepper{display:inline-flex;align-items:center;border-radius:10px;background:var(--fill);height:32px}
.stepper button{width:36px;height:32px;display:grid;place-items:center;color:var(--fg)}
.stepper button:hover{background:var(--fill)}
.stepper button:first-child{border-radius:10px 0 0 10px}.stepper button:last-child{border-radius:0 10px 10px 0}
.stepper output{min-width:44px;text-align:center;font-weight:600;font-size:14px;border-inline:1px solid var(--separator);line-height:20px}

/* Slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--p),var(--switch-off) var(--p))}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--p),var(--switch-off) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9.5px;box-shadow:0 2px 6px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* Select (Apple pop-up button) */
.select{position:relative;display:inline-flex;align-items:center}
.select select{-webkit-appearance:none;appearance:none;background:var(--fill);border:0;border-radius:9px;height:32px;padding:0 30px 0 12px;font-size:14px;font-weight:500;color:var(--fg);max-width:100%}
.select svg{position:absolute;right:8px;pointer-events:none;color:var(--fg-3)}
.select select option{background:var(--solid-2);color:var(--fg)}

/* Text field */
.field{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;background:var(--fill);color:var(--fg-3);min-width:0}
.field input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;color:var(--fg)}
.field input:focus-visible{outline:none}
.field input::placeholder{color:var(--fg-3)}
.field:focus-within{box-shadow:0 0 0 2.5px var(--accent-soft-2),0 0 0 1px var(--accent) inset}
.text-input{width:100%;height:40px;border-radius:10px;border:0;background:var(--fill);padding:0 12px;font-size:15px}

/* Grouped inset lists */
.group-h{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);margin:0 0 8px 16px}
.group{border-radius:var(--r-panel);overflow:hidden}
.group>.item+.item{box-shadow:inset 0 1px 0 var(--separator)}
.item{display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 16px;width:100%;text-align:left}
button.item:hover,a.item:hover{background:var(--fill-hover)}
.item .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.item .ic svg{width:17px;height:17px;stroke-width:1.9}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:500;font-size:15px;display:block}
.item .txt span{display:block;font-size:13px;color:var(--fg-2);margin-top:1px}
.item .val{color:var(--fg-2);font-size:14px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.group-f{font-size:12.5px;color:var(--fg-3);margin:8px 16px 0;line-height:1.45}
.ic.indigo{background:#5856D6}.ic.blue{background:#0A7AFF}.ic.teal{background:#0E9AA7}.ic.orange{background:#E97A10}.ic.green{background:#2AA556}.ic.gray{background:#7C7E8C}.ic.pink{background:#D9416C}.ic.purple{background:#9150D8}.ic.red{background:#E0383E}

/* Progress */
.bar{height:6px;border-radius:9px;background:var(--fill-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .5s var(--ease-out)}
.bar.thin{height:4px}
.bar.indet>i{width:35%!important;animation:indet 1.4s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft-2);border-top-color:var(--accent-text);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* Banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;font-size:14px}
.banner svg{flex:none;margin-top:1px}
.banner b{display:block;font-weight:600;color:var(--fg)}
.banner p{margin:2px 0 0;color:var(--fg-2)}
.banner .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.banner.info{background:var(--accent-soft)} .banner.info>svg{color:var(--accent-text)}
.banner.warn{background:var(--warning-soft)} .banner.warn>svg{color:var(--warning)}
.banner.bad{background:var(--danger-soft)} .banner.bad>svg{color:var(--danger)}
.banner.ok{background:var(--success-soft)} .banner.ok>svg{color:var(--success)}

/* ---------- Transcribe / home ---------- */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;width:100%;min-height:280px;border-radius:var(--r-card);padding:32px 24px;
  transition:transform .4s var(--ease-spring),background .25s,box-shadow .25s}
.drop .well{position:absolute;inset:10px;border-radius:calc(var(--r-card) - 10px);border:1.5px dashed var(--separator);pointer-events:none;transition:border-color .25s,background .25s}
.drop:hover .well{border-color:var(--accent-soft-2)}
.drop.over{transform:scale(1.012)}
.drop.over .well{border-color:var(--accent);background:var(--accent-soft)}
.drop .halo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);transition:transform .5s var(--ease-spring)}
.drop.over .halo,.drop:hover .halo{transform:translateY(-3px)}
.drop h2{font-family:var(--font-display);font-size:22px;font-weight:650;letter-spacing:-.02em;margin:4px 0 0}
.drop p{margin:0;color:var(--fg-2);font-size:14px}
.drop .formats{font-size:12px;color:var(--fg-3)}
.runbar{display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px;flex-wrap:wrap}
.runbar .rb-spacer{flex:1;min-width:8px}
.privacy-line{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--fg-2)}
.privacy-line svg{color:var(--success)}
.filecard{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r-card)}
.fileicon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(160deg,#7173F5,#4B4FE0);color:#fff;flex:none;box-shadow:0 6px 14px -6px #4B4FE0}
.fileicon.bad{background:linear-gradient(160deg,#F06A7A,#C8263A);box-shadow:0 6px 14px -6px #C8263A}
.filecard .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filecard .meta{font-size:13px;color:var(--fg-2)}
.recent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.recent button{border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .35s var(--ease-spring)}
.recent button:hover{transform:translateY(-2px)}
.recent .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .pv{font-size:13px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recent .mt{font-size:12px;color:var(--fg-3)}

.welcome{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:32px}
.welcome h2{font-family:var(--font-display);font-size:28px;line-height:1.15;letter-spacing:-.025em;font-weight:700;margin:16px 0 10px;text-wrap:balance}
.welcome p{margin:0;color:var(--fg-2)}
.welcome ul{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--fg-2)}
.welcome li{display:flex;gap:10px;align-items:flex-start}
.welcome li svg{color:var(--accent-text);margin-top:1px}
.reco{border-radius:18px;padding:18px;background:var(--glass-3);box-shadow:var(--shadow-1);border:1px solid var(--edge-low);display:flex;flex-direction:column;gap:12px}
.reco .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.reco .nm{font-weight:650;font-size:17px;letter-spacing:-.01em}
.meters{display:flex;gap:18px;font-size:12px;color:var(--fg-2)}
.meter{display:flex;align-items:center;gap:6px}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--fill-2)}
.dots i.on{background:var(--accent-text)}

/* ---------- Transcribing ---------- */
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 2px}
.stg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--fill-hover);font-size:13.5px;color:var(--fg-3);min-width:0}
.stg b{display:block;font-weight:600;color:inherit;font-size:13.5px}
.stg .ss{display:block;font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--fill-2);color:var(--fg-3)}
.stg.done{color:var(--fg)} .stg.done .dot{background:var(--success);color:#fff}
.stg.active{color:var(--fg);background:var(--accent-soft)} .stg.active .dot{background:transparent}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat .k{font-size:12px;color:var(--fg-3);font-weight:500}
.stat .v{font-size:20px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.live{display:flex;flex-direction:column;gap:2px}
.seg-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:8px 10px;border-radius:12px;text-align:left;width:100%;transition:background .2s}
.seg-row .ts{font-size:13px;color:var(--fg-3);font-variant-numeric:tabular-nums;padding-top:2px;font-weight:500}
.seg-row .tx{font-size:15.5px;line-height:1.55;color:var(--fg)}
.seg-row.new{animation:rise .6s var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.caret{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-text);margin-left:6px;animation:pulse 1.2s ease-in-out infinite;vertical-align:middle}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
button.seg-row:hover{background:var(--fill-hover)}
.seg-row.playing{background:var(--accent-soft)}
.seg-row.playing .ts{color:var(--accent-text)}
.no-ts .seg-row{grid-template-columns:minmax(0,1fr)} .no-ts .seg-row .ts{display:none}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
mark.cur{background:var(--accent);color:#fff}
.para{font-size:16px;line-height:1.7;max-width:68ch;padding:4px 10px}
.para p{margin:0 0 14px}

/* ---------- Result ---------- */
.res-head{display:flex;gap:16px;align-items:center}
.metas{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--fg-2)}
.metas span{display:inline-flex;align-items:center;gap:6px}
.metas svg{width:15px;height:15px;color:var(--fg-3)}
.player{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:999px}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;transition:transform .35s var(--ease-spring)}
.play:active{transform:scale(.92)}
.play svg{fill:currentColor;stroke:none}
.wave{flex:1;height:40px;display:flex;align-items:center;gap:2px;min-width:0;cursor:pointer;position:relative}
.wave i{flex:1;min-width:1px;border-radius:2px;background:var(--fill-2);transition:background .2s}
.wave i.p{background:var(--accent-text)}
.ptime{font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 12px 10px;border-bottom:1px solid var(--separator)}
.tools .field{flex:1;min-width:180px;max-width:320px}
.tools .spacer{flex:1}
.searchnav{display:flex;align-items:center;gap:2px;font-size:12.5px;color:var(--fg-3);white-space:nowrap}
.inline-sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.inline-sw .switch{transform:scale(.8);transform-origin:center}

/* ---------- Models ---------- */
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mstat{border-radius:18px;padding:14px 16px}
.mstat .k{font-size:12px;color:var(--fg-3);font-weight:500}
.mstat .v{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.mstat .bar{margin-top:10px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filters .field{flex:1;min-width:180px;max-width:280px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px 16px}
.mrow+.mrow{box-shadow:inset 0 1px 0 var(--separator)}
.mrow .nm{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mrow .hint{font-size:13px;color:var(--fg-2);margin-top:3px}
.mrow .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.mrow .side{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mrow .size{font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.dl{display:flex;flex-direction:column;gap:6px}.mrow .dl{grid-column:1/-1}
.dlmeta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--fg-2);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.mrow.disabled .nm,.mrow.disabled .hint{opacity:.55}
.state-ok{display:inline-flex;align-items:center;gap:5px;color:var(--success);font-size:13px;font-weight:600}
.fam-h{display:flex;align-items:baseline;gap:10px;margin:0 0 8px 16px}
.fam-h h3{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);margin:0}
.fam-h span{font-size:12.5px;color:var(--fg-3)}

/* ---------- History ---------- */
.hrow{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;min-height:72px}
.hrow+.hrow{box-shadow:inset 0 1px 0 var(--separator)}
.hrow .open{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-align:left;border-radius:12px}
.hrow .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none;font-size:10.5px;font-weight:650;letter-spacing:.02em}
.hrow .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .pv{font-size:13.5px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hrow .mt{font-size:12px;color:var(--fg-3);margin-top:3px;font-variant-numeric:tabular-nums}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 24px}
.empty .art{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);margin-bottom:6px}
.empty h2{font-family:var(--font-display);font-size:22px;font-weight:650;letter-spacing:-.02em;margin:0}
.empty p{margin:0;color:var(--fg-2);max-width:42ch}

/* ---------- Settings ---------- */
.sect-nav{display:flex;gap:6px;flex-wrap:wrap}
.sect-nav button{height:30px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:500}
.sect-nav button:hover{background:var(--fill-2)}
.settings{display:flex;flex-direction:column;gap:28px}
.ctl{display:flex;align-items:center;gap:10px;flex:none;max-width:60%}
.item.col{flex-direction:column;align-items:stretch;gap:10px}
.item.col .head{display:flex;align-items:center;gap:14px}
.sys{display:flex;flex-direction:column}
.sys .dev{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;font-size:13.5px}
.sys .dev+.dev{box-shadow:inset 0 1px 0 var(--separator)}
.sys .be{font-weight:600}
.sys .dn{color:var(--fg-2);min-width:0}
.sys .dn small{display:block;color:var(--fg-3);font-size:12px}
.disabled-block{opacity:.45;pointer-events:none}

/* ---------- Logs ---------- */
.logbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--separator)}
.logbar .field{flex:1;min-width:160px;max-width:300px}
.loglist{max-height:min(520px,60vh);overflow-y:auto;padding:6px 0}
.log{display:grid;grid-template-columns:96px 74px 150px minmax(0,1fr);gap:12px;padding:6px 16px;font-size:13px;align-items:baseline}
.log:nth-child(even){background:var(--fill-hover)}
.log .t{color:var(--fg-3);font-variant-numeric:tabular-nums}
.log .tg{color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .m{color:var(--fg);overflow-wrap:anywhere}
.lv{font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;justify-self:start}
.lv.error{background:var(--danger-soft);color:var(--danger)}
.lv.warn{background:var(--warning-soft);color:var(--warning)}
.lv.info{background:var(--accent-soft);color:var(--accent-text)}
.lv.debug{background:var(--fill);color:var(--fg-2)}
.lv.trace{background:var(--fill-hover);color:var(--fg-3)}

/* ---------- Layers: popovers, sheets, toasts ---------- */
.layer{position:absolute;inset:0;z-index:40;display:none}
.layer.open{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.layer.open .scrim{opacity:1}
.layer.pop .scrim{background:transparent}
.popover{position:absolute;width:340px;max-width:calc(100% - 24px);max-height:min(460px,70%);display:flex;flex-direction:column;border-radius:20px;padding:6px;
  transform-origin:top left;animation:popin .38s var(--ease-spring)}
@keyframes popin{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
.popover .ph{padding:8px 10px 6px;font-size:12px;font-weight:600;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase}
.popover>*{flex:none}
.popover{overflow-y:auto;scrollbar-width:thin}
.popover:has(#lang-list){overflow:hidden}
.popover .plist{display:flex;flex-direction:column;padding:2px}
.popover #lang-list{overflow-y:auto;flex:1 1 auto;min-height:0;scrollbar-width:thin}
.opt:focus-visible{outline-offset:-2px;border-radius:12px}
.popover .opt{flex:none}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-align:left;width:100%;font-size:14px;min-height:40px}
.opt:hover,.opt.kb{background:var(--fill)}
.opt .ck{width:18px;color:var(--accent-text);flex:none}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:500}
.opt .t span{display:block;font-size:12px;color:var(--fg-3)}
.opt[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.opt .r{font-size:12.5px;color:var(--fg-3);white-space:nowrap}
.popover hr{border:0;height:1px;background:var(--separator);margin:6px 8px}
.popover .field{margin:4px 4px 6px}
.menu{width:220px}
.opt.danger{color:var(--danger)}
.sheet-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.sheet{width:min(460px,100%);max-height:calc(100% - 24px);overflow:auto;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;animation:sheetin .45s var(--ease-spring)}
.sheet.wide{width:min(620px,100%)}
@keyframes sheetin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.sheet h2{font-family:var(--font-display);font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0}
.sheet p{margin:0;color:var(--fg-2)}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
.preview{border-radius:14px;background:var(--fill-hover);padding:12px 14px;font-size:13px;line-height:1.55;white-space:pre-wrap;max-height:260px;overflow:auto;color:var(--fg);font-variant-numeric:tabular-nums}
.kbd-list{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px}
kbd{font-family:var(--font);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);box-shadow:inset 0 -1px 0 var(--separator);color:var(--fg-2);white-space:nowrap}
.toasts{position:absolute;z-index:60;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:18px;font-size:14px;width:100%;animation:toastin .5s var(--ease-spring)}
.toast .grow{min-width:0}
.toast b{font-weight:600;display:block}
.toast span{color:var(--fg-2);font-size:13px}
.toast.out{animation:toastout .3s ease forwards}
@keyframes toastin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-8px) scale(.98)}}
.toast .tico{color:var(--accent-text)} .toast.ok .tico{color:var(--success)} .toast.warn .tico{color:var(--warning)} .toast.bad .tico{color:var(--danger)}

/* ---------- Container-driven responsive layout ---------- */
@container app (max-width:1000px){
  .shell{grid-template-columns:216px minmax(0,1fr)}
  .content{padding:24px 24px 40px}
  .welcome{grid-template-columns:1fr;padding:26px}
  .recent{grid-template-columns:repeat(2,minmax(0,1fr))}
  .recent button:nth-child(3){display:none}
  .log{grid-template-columns:90px 70px minmax(0,1fr)} .log .tg{display:none}
}
@container app (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .content{padding:18px 16px 112px;gap:16px}
  h1.lt{font-size:28px;line-height:34px}
  .topbar .titles{flex-basis:100%}
  h1.lt.file{font-size:22px;line-height:28px}
  .tabbar{display:flex;position:absolute;z-index:30;left:12px;right:12px;bottom:12px;border-radius:999px;padding:6px;justify-content:space-around;background:var(--glass-1)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--fg-2);padding:6px 0;border-radius:999px}
  .tabbar button[aria-current="page"]{color:var(--accent-text);background:var(--accent-soft)}
  .drop{min-height:240px;padding:28px 18px}
  .runbar{border-radius:22px;flex-direction:column;align-items:stretch}
  .runbar .pill{width:100%}
  .runbar .rb-spacer{display:none}
  .filecard #replace-file{display:none}
  .filecard .name{white-space:normal;overflow-wrap:anywhere}
  .runbar .btn{width:100%;height:44px}
  .stages{grid-template-columns:1fr}

<template id="notes-tpl">
  <h2>Concept: quiet glass</h2>
  <p class="lead">Purr should feel like an app Apple might ship. You drop in a file, see exactly what will run on it, and get text back. The glass gives depth and calm, the content stays crisp, and one indigo accent marks what you can act on.</p>
  <div class="ngrid">
    <div class="ncard"><h4>Show what will run</h4><p>Model and spoken language sit next to the Transcribe button as two pills, so they're visible and changeable without opening Settings.</p></div>
    <div class="ncard"><h4>Privacy you can see</h4><p>A green lock and "Stays on this device" appear where it matters: the sidebar, the run bar and the result. The About sheet lists what's stored and the one network use, which is model downloads.</p></div>
    <div class="ncard"><h4>Content over chrome</h4><p>Glass is for navigation and containers. Text always sits on a surface opaque enough to pass AA, never on the raw background.</p></div>
    <div class="ncard"><h4>One app, two platforms</h4><p>Browser mode hides desktop-only controls instead of greying them out. A single banner explains why they're missing.</p></div>
  </div>

  <h2>Layout and navigation</h2>
  <ul>
    <li><strong>Desktop (&gt;720px of app width):</strong> a floating glass sidebar inset 10px from the window, in the macOS 26 style. It holds Transcribe, History and Models at the top, Settings and Logs at the bottom, and the privacy pill. Content is centred: 880px max for reading views, 1040px for lists.</li>
    <li><strong>Phone (≤720px):</strong> the sidebar becomes a floating glass tab bar with Transcribe, History, Models and Settings. Logs is reached from Settings. Popovers become bottom sheets, and the run bar stacks into full-width rows.</li>
    <li><strong>Tablet:</strong> keeps the sidebar, narrowed to 216px. Grids drop to two columns.</li>
    <li>Breakpoints are <strong>container queries on the app window</strong>, not media queries, so the same component reflows in a desktop window, a split view or the viewport presets in this demo.</li>
    <li>Transcribing and the result reuse the Transcribe tab, so it never loses track of the file in progress.</li>
  </ul>

  <h2>Material system</h2>
  <p>There are three glass levels plus a solid fallback. Each is a fill, a backdrop blur with saturation, a 1px luminous edge and a specular top highlight.</p>
  <div class="tbl"><table>
    <thead><tr><th>Level</th><th>Used for</th><th>Light fill</th><th>Dark fill</th><th>Backdrop</th><th>Shadow</th></tr></thead>
    <tbody>
      <tr><td>1 · Chrome</td><td>Sidebar, tab bar</td><td>white 56%</td><td>#1A1C2C 56%</td><td>blur 28px, saturate 180%</td><td>shadow-1</td></tr>
      <tr><td>2 · Content</td><td>Cards, grouped lists, run bar, player</td><td>white 68%</td><td>#202234 62%</td><td>blur 28px, saturate 180%</td><td>shadow-1</td></tr>
      <tr><td>3 · Overlay</td><td>Popovers, sheets, toasts</td><td>#FBFBFF 84%</td><td>#24263A 82%</td><td>blur 28px, saturate 180%</td><td>shadow-3</td></tr>
      <tr><td>Solid</td><td>Reduce transparency, no backdrop-filter</td><td>#F3F4F9 / #FFF</td><td>#141627 / #1B1D31 / #222439</td><td>none</td><td>same</td></tr>
    </tbody></table></div>
  <ul>
    <li><strong>Edge:</strong> a 1px gradient border drawn with a mask, bright at the top (white 78% light, 14% dark) and fading to 30% / 6% at the bottom. It reads as light catching a rim.</li>
    <li><strong>Specular:</strong> <code>inset 0 1px 0</code>, white 85% in light and 8% in dark.</li>
    <li><strong>Shadows:</strong> two layers each, a tight contact shadow plus a soft ambient one with negative spread. shadow-1 is <code>0 1px 2px / 0 6px 20px -8px</code>, shadow-3 is <code>0 4px 12px / 0 30px 80px -24px</code>, both tinted indigo-black.</li>
    <li><strong>Ambient background:</strong> four blurred colour fields (indigo, lilac, aqua, peach) drift over 38–60 s using transforms only. In dark mode they're deeper and quieter. They switch off with Reduce transparency and stand still with Reduce motion.</li>
    <li>Glass never nests. Controls inside a card use flat fills (<code>--fill</code>), not more blur.</li>
  </ul>

  <p>The stack is <code>-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI Variable", system-ui, sans-serif</code>. On Apple platforms you get SF Pro for free. SF Pro's licence doesn't allow bundling it on the web, so <strong>ship Inter (variable, self-hosted) as the web and Windows/Linux face</strong>; its metrics are close to SF. Times use <code>tabular-nums</code>. There is no serif and no monospace.</p>

  <h2>Spacing, radii and motion</h2>
  <ul>
    <li><strong>Spacing:</strong> a 4pt grid (4, 8, 12, 16, 20, 24, 32). Sections are 20px apart, settings groups 28px. Row height is at least 52px, and touch targets are at least 44px on phone.</li>
    <li><strong>Concentric radii:</strong> inner radius = outer radius − inset. Window 28 → sidebar 18 (10px inset); card 22 → drop well 12 (10px inset); grouped list 20 → rows square; sheet 28; popover 20 → options 12 (6px inset); controls 10; pills and primary buttons fully round.</li>
    <li><strong>Motion:</strong> a spring curve <code>cubic-bezier(.32,1.28,.54,1)</code> for press-scale (0.96), switches, popovers and sheets (380–450 ms). Ease-out for progress. New transcript lines rise 6px and fade in. Only transform and opacity animate. With <strong>Reduce motion</strong>, durations drop to near zero, the colour fields stop and lines appear without movement.</li>
  </ul>

  <h2>Components and states</h2>
  <div class="tbl"><table>

      <tr><td>Buttons</td><td>Primary (filled accent), secondary (fill), plain (accent text), destructive. Hover, pressed scale, disabled at 45%.</td></tr>
      <tr><td>Switch / segmented / stepper / slider / pop-up</td><td>Apple geometry: switch 51×31, segmented 32 high, stepper 32 high, slider 5px track with 24px knob. Off, on, focus and disabled for each.</td></tr>

      <tr><td>Transcript line</td><td>Streaming (new), rest, hover, playing (tinted), search match, current match.</td></tr>
      <tr><td>Banner / toast</td><td>Info, success, warning, error. Toasts take an optional action (Retry, Undo, Start again) and close themselves after 4–7 s.</td></tr>

  <h2>Key flows</h2>
  <ul>
    <li><strong>First run:</strong> a welcome card recommends one model (Large v3 Turbo Q5, 547 MB) with a single download button, a smaller alternative and a link to all models. When the download finishes, the drop zone appears with that model selected.</li>
    <li><strong>Transcribe:</strong> drop a file or press ⌘/Ctrl+O, check the two pills, then press Transcribe. Progress shows three stages, then lines stream in live. The result opens with the player, search and export.</li>
    <li><strong>Recover:</strong> every error says what happened and what to do, with the next action as a button: choose another file, retry, download again, use a smaller model or view logs.</li>
  </ul>

  <h2>Saving settings: autosave</h2>
  <p>Settings save as soon as you change them, with a brief "Saved" tick, as in iOS and macOS System Settings. Every control is reversible, nothing is expensive to apply, and "Reset all settings" is the safety net. A save bar would add a step and an "unsaved changes" trap on a page people visit rarely.</p>

  <h2>Accessibility</h2>
  <ul>
    <li><strong>Contrast on glass, calculated for the worst-case backdrop:</strong> the most saturated colour field (indigo, full strength, before blur) under level-1 glass blends to about #D8D9FE in light. On that, fg-2 is 5.9:1, fg-3 4.7:1 and accent-text 5.4:1. In dark the worst case is about #232352: fg-2 7.4:1, fg-3 5.2:1. Fill opacities were set from these numbers. They still need measuring on real screens.</li>
    <li><strong>Reduce transparency</strong> comes from three sources: the in-app switch, <code>prefers-reduced-transparency</code>, and <code>@supports not (backdrop-filter)</code>. All three swap the glass tokens for solid ones, so no component needs special handling.</li>
    <li><strong>Keyboard:</strong> every control is a real button or input with a 2.5px accent focus ring. Segmented controls are radio groups moved with the arrow keys. The waveform is a slider (arrows ±5 s, Home/End). Shortcuts are listed under <kbd>?</kbd>.</li>
    <li><strong>Screen readers:</strong> switches use <code>role="switch"</code>. Progress is a <code>progressbar</code>. A polite live region announces stage changes, every fifth percent and completion, never every tick. Popovers and sheets are labelled modal dialogs.</li>
    <li>Information is never carried by colour alone: badges and banners always carry icons and words.</li>
  </ul>

  <h2>Browser support</h2>
  <ul>
    <li><code>backdrop-filter</code> works in Chrome, Edge, Firefox 103+ and Safari (with <code>-webkit-</code>, which is included). Without it you get the solid fallback.</li>
    <li>Container queries need Chrome 105+, Safari 16+ or Firefox 110+. WebGPU already requires newer versions than that.</li>
    <li>Tailwind: map the tokens to <code>theme.extend.colors</code> through CSS variables. Glass becomes three utilities (<code>.glass-1/2/3</code>) via <code>@layer components</code>, and <code>@container</code> variants cover the breakpoints.</li>
    <li>Performance: there are at most about 8 blurred layers on screen, and the colour fields animate transforms only. On low-end GPUs, consider turning the drift off automatically.</li>
  </ul>

  <h2>What I'd user-test first</h2>
  <ul>
    <li><strong>The run bar:</strong> do people notice and use the model and language pills before starting a long file? This is the complaint quoted in the sample transcript.</li>
    <li><strong>First run:</strong> do people accept the recommended 547 MB download, or hesitate? Test the wording of the size and the smaller alternative.</li>
    <li><strong>Glass legibility</strong> on real hardware, especially Windows with a bright wallpaper behind a translucent window, and on low-contrast laptop panels.</li>
    <li>Whether "Speed 4.6×" is understood without its explanatory line.</li>
  </ul>

/* ---------------- Helpers ---------------- */
const fmtT = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
const fmtTook = s => s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60 ? (s % 60) + " s" : ""}`.trim();
const langLabel = () => S.lang === "auto" ? "Automatic" : S.lang;
const downloaded = () => MODELS.filter(m => S.dl[m.id] === "ok" || S.dl[m.id] === "corrupt");
const needsFeature = m => m.f16 && (S.platform === "browser" || S.noF16);
const announce = t => { const a = $("#announcer"); a.textContent = ""; setTimeout(() => a.textContent = t, 30); };
const dots = (n, label) => `<span class="dots" role="img" aria-label="${label} ${n} of 5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
const meters = m => `<span class="meters"><span class="meter">Speed ${dots(FAM[m.fam].speed, "Speed")}</span><span class="meter">Accuracy ${dots(Math.max(1, FAM[m.fam].acc - (m.q ? 0 : 0)), "Accuracy")}</span></span>`;

function toast(title, sub = "", kind = "", icon = "info", action) {
  const t = document.createElement("div");
  t.className = `toast glass g3 ${kind}`;
  t.innerHTML = `<span class="tico">${ic(icon)}</span><div class="grow"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</div>${action ? `<button class="btn sm plain" data-toast-act>${esc(action.label)}</button>` : ""}<button class="icon-btn" aria-label="Dismiss">${ic("x", "sm")}</button>`;
  const kill = () => { t.classList.add("out"); setTimeout(() => t.remove(), 300); };
  t.querySelector('[aria-label="Dismiss"]').onclick = kill;
  if (action) t.querySelector("[data-toast-act]").onclick = () => { kill(); action.run(); };
  $("#toasts").appendChild(t);
  setTimeout(kill, action ? 7000 : 4200);
}
let savedT;
function saved() { const s = $("#saved"); if (!s) return; s.classList.add("on"); clearTimeout(savedT); savedT = setTimeout(() => s.classList.remove("on"), 1600); }

function sw(key, on, label, extra = "") { return `<button class="switch" role="switch" id="sw-${key}" data-sw="${key}" aria-checked="${!!on}" aria-label="${esc(label)}" ${extra}></button>`; }
function seg(key, opts, val, label, cls = "") {
  return `<div class="seg ${cls}" role="radiogroup" aria-label="${esc(label)}" data-seg="${key}">${opts.map(([v, l, icn]) => `<button role="radio" id="seg-${key}-${v}" data-v="${v}" aria-checked="${v === val}" tabindex="${v === val ? 0 : -1}">${icn ? ic(icn, "sm") : ""}${l}</button>`).join("")}</div>`;
}
function stepper(key, val, label, disp) { return `<div class="stepper" role="group" aria-label="${esc(label)}"><button data-step="${key}" data-d="-1" id="st-${key}-m" aria-label="Decrease ${esc(label)}">${ic("minus", "sm")}</button><output class="tnum" aria-live="polite">${disp ?? val}</output><button data-step="${key}" data-d="1" id="st-${key}-p" aria-label="Increase ${esc(label)}">${ic("plus", "sm")}</button></div>`; }
function select(key, opts, val, label) { return `<span class="select"><select id="sel-${key}" data-sel="${key}" aria-label="${esc(label)}">${opts.map(([v, l]) => `<option value="${v}" ${v === val ? "selected" : ""}>${l}</option>`).join("")}</select>${ic("updown", "sm")}</span>`; }
function item({ icon, color, title, sub, ctl = "", cls = "", tag = "div", attrs = "" }) {
  return `<${tag} class="item ${cls}" ${attrs}>${icon ? `<span class="ic ${color}">${ic(icon)}</span>` : ""}<span class="txt"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</span>${ctl ? `<span class="ctl">${ctl}</span>` : ""}</${tag}>`;
}

/* ---------------- Theme / platform ---------------- */
function applyGlobal() {
  const r = document.documentElement;
  r.classList.toggle("rt", S.rt);

function setTheme(t) { S.theme = t; const r = document.documentElement; if (t === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t); }
/* ---------------- Navigation ---------------- */
const TITLES = { transcribe: "Transcribe", history: "History", models: "Models", preferences: "Settings", logs: "Logs" };
function go(view, opts = {}) {
  if (!TITLES[view]) view = "transcribe";
  S.view = view;
  if (!opts.noHash) { try { history.replaceState(null, "", "#" + view); } catch (e) {} }
  render();
  $("#scroller").scrollTop = 0;
  if (opts.focus !== false) { const h = $("#content h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); } }
}
function render() {
  applyGlobal();
  const keep = document.activeElement && document.activeElement.id;
  $$("[data-go]").forEach(b => b.dataset.go === S.view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  const c = $("#content");
  c.className = "content" + (["models", "logs", "history"].includes(S.view) ? " wide" : "");
  c.innerHTML = VIEWS[S.view]();
  after();
  if (keep) { const el = document.getElementById(keep); if (el && el !== document.body && !el.closest("#demo")) { el.focus({ preventScroll: true }); if (el.tagName === "INPUT" && el.type !== "range") { const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} } } }
}
function after() {
  if (S.view === "transcribe" && S.phase === "result") paintWave();
  if (S.view === "logs" && S.autoscroll) { const l = $("#loglist"); if (l) l.scrollTop = l.scrollHeight; }
  $$('input[type=range]').forEach(r => r.style.setProperty("--p", (r.value - r.min) / (r.max - r.min) * 100 + "%"));
}

/* ---------------- Views ---------------- */
const VIEWS = {};

function header(title, sub, right = "") { return `<div class="topbar"><div class="titles"><h1 class="lt">${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}</div>${right}</div>`; }

function pickers() {

VIEWS.transcribe = () => {

function firstRun() {
  const reco = byId("large-v3-turbo-q5"), p = S.prog[reco.id], st = S.dl[reco.id];
  const busy = st === "downloading" || st === "offline";
  return `${header("Welcome to Purr", "Private speech to text. Everything runs on this " + (S.platform === "browser" ? "computer, in your browser." : "computer."))}

      <ul>
        <li>${ic("check", "sm")}<span>Models are stored on this device. You can add or remove them any time.</span></li>
        <li>${ic("check", "sm")}<span>${S.platform === "browser" ? "Uses your graphics card through WebGPU." : "Uses your graphics card when one is available, otherwise the CPU."}</span></li>

        : `<button class="btn primary lg" data-act="dl" data-id="${reco.id}" id="fr-dl">${ic("download")}Download ${reco.name} · ${fmtSize(reco.size)}</button>`}

    </div>

function dlBlock(m) {
  const p = S.prog[m.id] || { pct: 0, speed: 0 };

  return `<div class="dl" id="dl-${m.id.replace(/\./g, "_")}">
    <div class="bar ${off ? "" : ""}"><i style="width:${p.pct}%;${off ? "background:var(--warning)" : ""}"></i></div>
    <div class="dlmeta"><span>${done} MB of ${fmtSize(m.size)}</span><span>${off ? `<span style="color:var(--warning)">Waiting for a connection</span>` : `${p.speed.toFixed(1)} MB/s · ${left < 60 ? left + " s" : Math.ceil(left / 60) + " min"} left`}</span></div>
    <div class="row" style="justify-content:flex-end"><button class="btn sm" data-act="dl-cancel" data-id="${m.id}" id="cancel-${m.id.replace(/\./g, "_")}">Cancel download</button></div>

}

    <div class="recent">${recent.map(h => `<button class="glass" data-act="open-h" data-id="${h.id}" id="rc-${h.id}"><span class="nm">${esc(h.name)}</span><span class="pv">${esc(h.segs[0][1])}</span><span class="mt tnum">${h.date} · ${fmtT(h.dur)} · ${h.lang}</span></button>`).join("")}</div>` : ""}`;

function noWebGPU() {

function failed() {

function result() {
  const h = S.current, m = byId(h.model) || byId(S.model);
  const q = S.q.trim().toLowerCase();
  let count = 0;
  const hl = t => {
    if (!q) return esc(t);
    const parts = t.split(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "ig"));
    return parts.map((p, i) => i % 2 ? `<mark data-mi="${count}" class="${count++ === S.qi ? "cur" : ""}">${esc(p)}</mark>` : esc(p)).join("");
  };
  const curSeg = h.segs.reduce((a, s, i) => s[0] <= S.pos ? i : a, 0);
  const body = S.mode === "segments"

function paras(segs) { const out = []; segs.forEach((s, i) => { if (i % 4 === 0) out.push([s[0], s[1]]); else out[out.length - 1][1] += " " + s[1]; }); return out; }

function paintWave() {
  const w = $("#wave"); if (!w) return;
  const n = Math.max(40, Math.min(110, Math.floor(w.clientWidth / 5)));
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const dur = S.current.dur, cut = S.pos / dur * n;
  let html = "";
  for (let i = 0; i < n; i++) { const env = .35 + .65 * Math.abs(Math.sin(i / n * Math.PI * 5.3 + 1)); const v = Math.max(.12, Math.min(1, env * (.45 + rnd() * .65))); html += `<i class="${i < cut ? "p" : ""}" style="height:${Math.round(v * 100)}%"></i>`; }
  w.innerHTML = html;
}
function setPos(t) {
  const h = S.current; S.pos = Math.max(0, Math.min(h.dur, t));
  const w = $("#wave"); if (!w) return;
  const bars = w.children, cut = S.pos / h.dur * bars.length;
  for (let i = 0; i < bars.length; i++) bars[i].classList.toggle("p", i < cut);
  w.setAttribute("aria-valuenow", Math.round(S.pos)); w.setAttribute("aria-valuetext", `${fmtT(S.pos)} of ${fmtT(h.dur)}`);
  $("#ptime").textContent = `${fmtT(S.pos)} / ${fmtT(h.dur)}`;
  const cur = h.segs.reduce((a, s, i) => s[0] <= S.pos ? i : a, 0);
  $$("#segs .seg-row").forEach((r, i) => r.classList.toggle("playing", i === cur));
}
function togglePlay(force) {
  S.playing = force ?? !S.playing;
  clearInterval(timers.play);
  const b = $("#play-btn");
  if (b) { b.innerHTML = ic(S.playing ? "pause" : "play"); b.setAttribute("aria-label", S.playing ? "Pause" : "Play"); }
  if (S.playing) timers.play = setInterval(() => { if (S.view !== "transcribe" || S.phase !== "result") return togglePlay(false); if (S.pos >= S.current.dur) return togglePlay(false); setPos(S.pos + .25); }, 250);
}

function modelRow(m) {

  else if (st === "verifying") side = `<span class="row" style="gap:8px;font-size:13px;color:var(--fg-2)"><span class="spinner"></span>Checking files…</span>`;

/* ---------------- Layers ---------------- */
let layerOpener = null, layerKeys = null;
function openLayer(html, { type = "sheet", anchor, label = "Dialog", onKey } = {}) {
  const L = $("#layer"), body = $("#layer-body");

  L.removeAttribute("aria-hidden");
  body.innerHTML = type === "pop" ? `<div class="popover glass g3" role="dialog" aria-modal="true" aria-label="${esc(label)}" id="pop">${html}</div>`
    : `<div class="sheet-wrap" data-act="close-layer-bg"><div class="sheet glass g3" role="dialog" aria-modal="true" aria-label="${esc(label)}" id="sheet">${html}</div></div>`;
  if (type === "pop" && anchor) {
    const app = $("#app").getBoundingClientRect(), r = anchor.getBoundingClientRect(), p = $("#pop");
    const pw = p.offsetWidth, ph = p.offsetHeight;
    let left = Math.min(Math.max(12, r.left - app.left), app.width - pw - 12);

function modelPicker(anchor) {

/* ---------------- Exports ---------------- */
const pad = (n, l = 2) => String(n).padStart(l, "0");
const ts = (s, sep) => `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(Math.floor(s % 60))}${sep}${pad(Math.round((s % 1) * 1000), 3)}`;
function exportText(fmt) {
  const h = S.current, segs = h.segs.map((s, i) => ({ start: s[0], end: h.segs[i + 1] ? h.segs[i + 1][0] : Math.min(h.dur, s[0] + 8), text: s[1] }));
  if (fmt === "txt") return segs.map(s => s.text).join("\n");
  if (fmt === "srt") return segs.map((s, i) => `${i + 1}\n${ts(s.start, ",")} --> ${ts(s.end, ",")}\n${s.text}`).join("\n\n");
  if (fmt === "vtt") return "WEBVTT\n\n" + segs.map(s => `${ts(s.start, ".")} --> ${ts(s.end, ".")}\n${s.text}`).join("\n\n");
  return JSON.stringify({ file: h.name, language: h.lang, model: h.model, duration: h.dur, segments: segs }, null, 2);
}
function exportSheet(fmt) {
  S.exportFmt = fmt;
  const base = S.current.name.replace(/\.[^.]+$/, "");
  openLayer(`<h2>Export transcript</h2>${seg("exportFmt", [["txt", "TXT"], ["srt", "SRT"], ["vtt", "VTT"], ["json", "JSON"]], fmt, "Format", "full")}
    <p class="foot" id="ex-desc">${({ txt: "Plain text, one line per segment.", srt: "Subtitles for video players and editors.", vtt: "Subtitles for web video.", json: "Segments with start and end times, for scripts and other apps." })[fmt]}</p>
    <div class="preview" id="ex-prev" tabindex="0" aria-label="Preview">${esc(exportText(fmt).slice(0, 1400))}${exportText(fmt).length > 1400 ? "\n…" : ""}</div>
    <div class="acts"><button class="btn" data-act="ex-copy" id="ex-copy">${ic("copy", "sm")}Copy</button><button class="btn primary" data-act="ex-save" id="ex-save">${ic("download", "sm")}Save ${esc(base)}.${fmt}</button></div>`, { label: "Export transcript" });
}

/* ---------------- Simulations ---------------- */
function startDownload(id) {
  const m = byId(id); if (!m || needsFeature(m)) return;
  S.dl[id] = "downloading"; S.prog[id] = { pct: S.prog[id]?.pct && S.dl[id] !== "ok" ? S.prog[id].pct : 0, speed: 0 };
  if (S.prog[id].pct >= 100) S.prog[id].pct = 0;
  announce(`Downloading ${mLabel(m)}`);
  tickDownloads(); render();
}
function tickDownloads() {
  clearInterval(timers.dl);
  timers.dl = setInterval(() => {
    let any = false;
    for (const [id, st] of Object.entries(S.dl)) {
      if (st === "offline") { any = true; continue; }
      if (st !== "downloading") continue;
      any = true;
      const m = byId(id), p = S.prog[id];
      if (S.offline) { S.dl[id] = "offline"; p.speed = 0; continue; }
      p.speed = 20 + Math.random() * 9;
      p.pct = Math.min(100, p.pct + p.speed * .4 / m.size * 100 * (m.size > 600 ? 6 : 1.6));
      if (S.failNext && p.pct > 38) { S.failNext = false; S.dl[id] = "failed"; toast(`${mLabel(m)} didn't finish downloading`, "The connection was reset. Purr will resume where it stopped.", "bad", "xcircle", { label: "Retry", run: () => startDownload(id) }); continue; }
      if (p.pct >= 100) {
        S.dl[id] = "ok"; delete S.prog[id];
        toast(`${mLabel(m)} is ready`, "Downloaded and verified.", "ok", "checkcircle");
        if (S.phase === "firstrun") { S.phase = "idle"; S.model = id; }
      }
    }
    if (!any) clearInterval(timers.dl);
    patchDownloads();
  }, 400);
}
function patchDownloads() {
  if (S.view === "models" || (S.view === "transcribe" && (S.phase === "firstrun" || S.phase === "idle"))) {
    const keep = document.activeElement?.id;
    const scroll = $("#scroller").scrollTop;
    $("#content").innerHTML = VIEWS[S.view](); after();
    $("#scroller").scrollTop = scroll;
    if (keep) document.getElementById(keep)?.focus({ preventScroll: true });
  }
  applyGlobal();
}

function startRun() {
  if (!S.file) S.file = { name: SAMPLE.name, dur: SAMPLE.dur, bytes: SAMPLE.bytes, ext: SAMPLE.ext };
  stopRun();
  S.phase = "running"; S.fileError = null;
  S.run = { stage: 0, n: 0, el: 0, pct: 0, speed: 0, t: 0 };
  go("transcribe", { focus: false });
  announce("Loading the model");
  const fast = reduceMotion();
  timers.run = setInterval(() => {
    const r = S.run; if (!r) return;
    r.el += .25; r.t += .25;
    if (r.stage === 0 && r.t >= 1.6) { r.stage = 1; r.t = 0; rerunRender(); announce(S.lang === "auto" ? "Detecting the language" : "Transcribing"); }
    else if (r.stage === 1 && r.t >= 1.2) { r.stage = 2; r.t = 0; rerunRender(); if (S.lang === "auto") announce("Detected English. Transcribing."); }
    else if (r.stage === 2 && r.t >= 1.3) {
      r.t = 0;
      if (S.failNext && r.n >= 8) { S.failNext = false; stopRun(); S.phase = "failed"; render(); announce("Transcription failed"); return; }
      if (r.n < SAMPLE.segs.length) {
        const s = SAMPLE.segs[r.n++]; r.pct = r.n / SAMPLE.segs.length * 100; r.speed = (SAMPLE.segs[r.n] ? SAMPLE.segs[r.n][0] : SAMPLE.dur) / r.el;
        const live = $("#live"), caret = $("#caret-row");
        if (live && caret) { caret.insertAdjacentHTML("beforebegin", segRow(s, fast ? "" : "new")); }
        $("#seg-count") && ($("#seg-count").textContent = r.n);
        const bar = $("#run-bar"); if (bar) { bar.firstElementChild.style.width = r.pct + "%"; bar.setAttribute("aria-valuenow", Math.round(r.pct)); }
        $("#r-pct") && ($("#r-pct").textContent = Math.round(r.pct) + "%");
        $("#r-sp") && ($("#r-sp").textContent = r.speed.toFixed(1) + "×");
        if (r.n % 5 === 0) announce(`${Math.round(r.pct)} percent`);
      } else {
        stopRun();
        const took = Math.round(r.el);
        const item = { ...SAMPLE, id: "h" + Date.now(), name: S.file.name, dur: S.file.dur || SAMPLE.dur, took, date: "Just now", model: S.model, lang: S.lang === "auto" ? "English" : S.lang };
        S.history = [item, ...S.history.filter(h => h.name !== item.name)];
        S.current = item; S.phase = "result"; S.pos = 0; S.q = ""; S.playing = false;
        render(); toast("Transcription finished", `${fmtT(item.dur)} of audio in ${took} s`, "ok", "checkcircle");
        announce("Transcription finished");
        return;
      }
    }
    $("#r-el") && ($("#r-el").textContent = fmtT(r.el));
  }, 250);
}
function rerunRender() { if (S.view === "transcribe") { const c = $("#content"); c.innerHTML = VIEWS.transcribe(); } }
function stopRun() { clearInterval(timers.run); timers.run = null; }

function pickFile(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const ok = ["mp3", "wav", "aac", "flac", "ogg", "opus", "m4a", "webm"].includes(ext);
  if (!ok) { S.fileError = "type"; S.file = null; S.phase = "idle"; render(); announce("This kind of file isn't supported"); return; }
  if (file.size === 0) { S.fileError = "empty"; S.file = null; S.phase = "idle"; render(); return; }
  S.fileError = null; S.file = { name: file.name, dur: 112, bytes: file.size > 1e6 ? (file.size / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(file.size / 1e3)) + " KB", ext: ext.toUpperCase() };
  S.phase = "ready"; go("transcribe", { focus: false });
  $("#start-btn")?.focus();
}

/* ---------------- Events ---------------- */
document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("#demo")) return;
  const goEl = t.closest("[data-go]");
  if (goEl && !goEl.closest("#layer-body .opt")) { if ($("#layer").classList.contains("open")) closeLayer(); go(goEl.dataset.go); return; }
  const segBtn = t.closest("[data-seg] [role=radio]");
  if (segBtn) { setSeg(segBtn.closest("[data-seg]").dataset.seg, segBtn.dataset.v, segBtn); return; }
  const swb = t.closest("[data-sw]");
  if (swb) { toggleSw(swb.dataset.sw, swb); return; }
  const st = t.closest("[data-step]");
  if (st) { step(st.dataset.step, +st.dataset.d); return; }
  if (t.closest('[data-act="close-layer"]') || (t.matches('[data-act="close-layer-bg"]'))) { closeLayer(); return; }
  const a = t.closest("[data-act]"); if (!a) return;

  switch (act) {

    case "cancel-run": stopRun(); S.phase = "ready"; S.run = null; render(); toast("Transcription cancelled", "Nothing was saved. The file is still selected.", "", "info", { label: "Start again", run: startRun }); $("#start-btn")?.focus(); break;
    case "new": togglePlay(false); S.file = null; S.phase = "idle"; S.q = ""; render(); break;
    case "pick-model": modelPicker(a); break;
    case "pick-lang": langPicker(a); break;
    case "set-model": { const m = byId(id); if (needsFeature(m)) return; S.model = id; closeLayer(); render(); saved(); announce(`Model set to ${mLabel(m)}`); break; }
    case "dl-from-pick": { const m = byId(id); if (needsFeature(m)) return; closeLayer(); startDownload(id); toast(`Downloading ${mLabel(m)}`, `${fmtSize(m.size)}. You can keep using Purr meanwhile.`, "", "download"); break; }
    case "go-models": closeLayer(); go("models"); break;
    case "set-lang": S.lang = a.dataset.v; closeLayer(); render(); saved(); announce(`Spoken language set to ${langLabel()}`); break;
    case "dl": startDownload(id); break;
    case "dl-cancel": S.dl[id] = undefined; delete S.dl[id]; delete S.prog[id]; render(); toast("Download cancelled", "Partial files were removed.", "", "info"); break;
    case "m-menu": {

      if (k === "use") { S.model = id; render(); toast(`Using ${mLabel(m)}`, "For new transcriptions.", "ok", "checkcircle"); }
      if (k === "verify") { S.dl[id] = "verifying"; render(); setTimeout(() => { S.dl[id] = "ok"; patchDownloads(); toast("Files check out", `${mLabel(m)} matches its published checksums.`, "ok", "shield"); }, 1800); }
      if (k === "del" && await confirmSheet({ title: `Delete ${mLabel(m)}?`, body: `This frees ${fmtSize(m.size)}. You can download it again later.${S.model === id ? " Purr will switch to another downloaded model." : ""}`, ok: "Delete model" })) {
        delete S.dl[id]; if (S.model === id) S.model = downloaded()[0]?.id || "large-v3-turbo-q5"; render(); toast(`${mLabel(m)} deleted`, `${fmtSize(m.size)} freed.`, "", "trash");
        if (!downloaded().length) { S.phase = "firstrun"; }
      }
      break;
    }
    case "open-h": { const h = S.history.find(x => x.id === id); if (!h) return; S.current = h; S.phase = "result"; S.pos = 0; S.q = ""; S.qi = 0; togglePlay(false); go("transcribe"); break; }
    case "h-menu": {

    case "export-menu": { const k = await menu(a, [["txt", "Plain text", "TXT"], ["srt", "Subtitles", "SRT"], ["vtt", "Web subtitles", "VTT"], ["json", "Data", "JSON"]].map(([k, l, r]) => ({ k, label: l, r, icon: "doc" })), "Export format"); if (k) exportSheet(k); break; }
    case "ex-copy": copyText(exportText(S.exportFmt), "Copied", S.exportFmt.toUpperCase() + " text is on the clipboard."); break;
    case "ex-save": closeLayer(); toast(`Saved ${S.current.name.replace(/\.[^.]+$/, "")}.${S.exportFmt}`, "To Downloads. (Prototype: no file is written.)", "ok", "checkcircle"); break;
    case "play": togglePlay(); break;
    case "seek": setPos(+a.dataset.t); togglePlay(true); break;
    case "q-next": case "q-prev": { const n = $$("#segs mark").length; if (!n) return; S.qi = (S.qi + (act === "q-next" ? 1 : -1) + n) % n; render(); $(`#segs mark.cur`)?.scrollIntoView({ block: "center" }); break; }

    case "reset": if (await confirmSheet({ title: "Reset all settings?", body: "Theme, language, model choice, performance and logging go back to their defaults. Downloaded models and your history stay.", ok: "Reset settings" })) { S.settings = { ...DEF_SETTINGS }; setTheme("system"); S.lang = "auto"; S.rt = false; render(); toast("Settings reset", "Defaults restored.", "ok", "reset"); } break;
    case "log-export": { const k = await menu(a, [{ k: "txt", label: "Text", r: ".log", icon: "doc" }, { k: "json", label: "JSON", r: ".json", icon: "doc" }, { k: "csv", label: "CSV", r: ".csv", icon: "doc" }], "Export logs"); if (k) toast(`Saved purr-logs.${k === "txt" ? "log" : k}`, `${S.logs.length} entries. (Prototype: no file is written.)`, "ok", "checkcircle"); break; }

    case "toast-desktop": toast("Desktop app", "Prototype: this would open the download page.", "", "desktop"); break;
  }
});
function renameSheet(h) {
  openLayer(`<h2>Rename transcript</h2><label class="sr" for="rn">Name</label><input class="text-input" id="rn" value="${esc(h.name)}"><p class="foot">Only the name in Purr changes. The audio file keeps its name.</p><div class="acts"><button class="btn" id="rn-no">Cancel</button><button class="btn primary" id="rn-ok">Rename</button></div>`, { label: "Rename transcript" });
  const i = $("#rn"); i.select();
  const ok = () => { const v = i.value.trim(); if (v) { h.name = v; closeLayer(); render(); toast("Renamed", v, "ok", "pencil"); } };
  $("#rn-ok").onclick = ok; $("#rn-no").onclick = closeLayer; i.onkeydown = e => { if (e.key === "Enter") ok(); };
}
function aboutSheet() {
  openLayer(`<div class="row"><span class="fileicon" style="background:linear-gradient(160deg,#7A7CFF,#4146D6)">${ic("cat", "lg")}</span><div><h2>Your audio stays here</h2><p class="foot" style="margin-top:2px">Purr 1.4.0 · ${S.platform === "desktop" ? "Desktop" : "Web"}</p></div></div>
    <div class="group" style="background:var(--fill-hover)">
      ${item({ icon: "music", color: "green", title: "Audio files", sub: "Read from your disk and processed in memory. Never uploaded." })}
      ${item({ icon: "doc", color: "green", title: "Transcripts and history", sub: S.platform === "desktop" ? "Saved in Purr's app data folder on this computer." : "Saved in this browser's storage for this site." })}
      ${item({ icon: "cube", color: "green", title: "Models, settings and logs", sub: "Stored locally. Logs never contain transcript text." })}
      ${item({ icon: "download", color: "blue", title: "The only network use", sub: "Downloading models, over HTTPS, when you ask for one." + (S.platform === "browser" ? " The web page itself is loaded from its host." : "") })}
    </div>
    <div class="acts"><button class="btn primary" id="about-ok" data-act="close-layer">Done</button></div>`, { label: "Privacy" });
}
function keysSheet() {
  const k = [["Open a file", `${MOD}+O`], ["Search the transcript", `${MOD}+F`], ["Copy the transcript", `${MOD}+Shift+C`], ["Export", `${MOD}+E`], ["Play or pause", "Space"], ["Go to Transcribe, History, Models", `${MOD}+1, 2, 3`], ["Settings", `${MOD}+,`], ["Show shortcuts", "?"], ["Close a sheet or menu", "Esc"]];
  openLayer(`<h2>Keyboard shortcuts</h2><div class="kbd-list">${k.map(([a, b]) => `<span>${a}</span><span>${b.split(", ").map(x => `<kbd>${x}</kbd>`).join(" ")}</span>`).join("")}</div><div class="acts"><button class="btn primary" data-act="close-layer" id="keys-ok">Done</button></div>`, { label: "Keyboard shortcuts" });
}
function copyText(text, title, sub) {
  const done = () => toast(title, sub, "ok", "copy");
  const fail = () => { const el = $("#ex-prev") || $("#segs"); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Couldn't copy automatically", "The text is selected. Press " + MOD + "+C to copy it.", "warn", "copy"); };
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
}
function setSeg(key, v, btn) {
  const grp = btn && btn.closest("[data-seg]");
  if (grp) $$("[role=radio]", grp).forEach(b => { b.setAttribute("aria-checked", b === btn); b.tabIndex = b === btn ? 0 : -1; });
  if (key === "page") return setPage(v);

  if (key === "mFilter") { S.mFilter = v; render(); return; }
  if (key === "logLv") { S.logLv = v; render(); return; }
  if (key === "exportFmt") { exportSheet(v); $(`#seg-exportFmt-${v}`)?.focus(); return; }
