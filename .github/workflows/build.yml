name: build
on:
  push:
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Create nightly release"
        required: false
        default: false
        type: boolean
      windows_single_backends:
        description: "Also build the Windows CLI with CUDA only and with Vulkan only"
        required: false
        default: false
        type: boolean

concurrency:
  # scheduled and manual runs get their own group so a push to develop never replaces a nightly
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  DIOXUS_VERSION: 0.8.0-alpha.3
  CUDA_VERSION: 13.5.0
  VULKAN_SDK_VERSION: 1.4.363.1
  GGML_NATIVE: "OFF"
  # true: the release archives leave the Windows CUDA libraries out, and they ship as the runtime pack only
  PURR_SPLIT_CUDA_RUNTIME: "false"

jobs:
  ffmpeg-linux:
    name: ffmpeg (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-linux
          prepare: true

  ffmpeg-macos:
    name: ffmpeg (macos)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: arm64-osx
          prepare: true

  ffmpeg-windows:
    name: ffmpeg (windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-windows-static
          prepare: true

  cli-linux:
    name: cli (linux, ${{ matrix.variant }})
    needs: [ffmpeg-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GGML_CUDA_NO_VMM: ${{ matrix.cuda_no_vmm && 'ON' || 'OFF' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            features: static-ffmpeg
            portable: true
          - variant: vulkan
            features: static-ffmpeg,vulkan
            portable: true
            save_cache: true
            deferred_libs: libvulkan.so.1
            expect_missing: vulkan=libvulkan.so.1
          - variant: cuda
            features: static-ffmpeg,cuda
            save_cache: true
          - variant: all
            features: static-ffmpeg,cuda,vulkan
            cuda_no_vmm: true
            portable: true
            save_cache: true
            deferred_libs: libcuda.so.1 libvulkan.so.1
            expect_missing: cuda=libcuda.so.1 vulkan=libvulkan.so.1
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang curl pkg-config gcc ca-certificates openssl libssl-dev cmake libc6-dev make wget llvm patchelf
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-linux
      - if: contains(matrix.features, 'cuda')
        uses: ./.github/actions/setup-cuda-linux
        with:
          version: ${{ env.CUDA_VERSION }}
      - if: contains(matrix.features, 'vulkan')
        uses: ./.github/actions/setup-vulkan
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # whisper-rs-sys does not rebuild ggml when GGML_* or the GPU SDKs change, so each configuration needs its own cache
          key: ${{ matrix.variant }}-ggml-native-${{ env.GGML_NATIVE }}-no-vmm-${{ env.GGML_CUDA_NO_VMM }}-cuda-${{ env.CUDA_VERSION }}-vulkan-${{ env.VULKAN_SDK_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/develop' && matrix.save_cache == true }}
      - name: Build the CLI
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/lib:$ORIGIN/../lib/purr-desktop --cfg=web_sys_unstable_apis
        run: |
          cargo build -p purr-cli --release --features ${{ matrix.features }}
      - name: Prepare CLI artifact
        run: |
          mkdir -p artifacts/cli
          cp target/release/purr artifacts/cli/purr
          if [ "${{ contains(matrix.features, 'cuda') }}" = "true" ]; then
            mkdir -p artifacts/cli/lib
            ldd target/release/purr | awk '/lib(cudart|cublas|cublasLt)\.so/ { print $3 }' | xargs -r -I{} cp -L {} artifacts/cli/lib/
          fi
          echo "$(git describe --tags --always --dirty)" > artifacts/cli/VERSION
          ls -lR artifacts/cli
      - name: Check the CLI does not need the deferred libraries
        if: matrix.deferred_libs
        run: |
          status=0
          for file in artifacts/cli/purr artifacts/cli/lib/*; do
            [ -f "$file" ] || continue
            echo "$file needs: $(patchelf --print-needed "$file" | tr '\n' ' ')"
            for library in ${{ matrix.deferred_libs }}; do
              if patchelf --print-needed "$file" | grep -qxF "$library"; then
                echo "::error file=$file::$file has a hard dependency on $library"
                status=1
              fi
            done
          done
          exit $status
      - name: Run the CLI on the runner
        if: matrix.portable
        run: |
          artifacts/cli/purr sys || echo "::warning::purr sys failed on the runner"
      - name: Check the CLI starts on a bare Ubuntu without GPU runtimes
        if: matrix.portable
        run: |
          image="ubuntu:$(lsb_release -rs)"
          docker run --rm -v "$PWD/artifacts/cli:/opt/purr:ro" "$image" sh -c '
            set -e
            ldd /opt/purr/purr
            if ldd /opt/purr/purr | grep -F "not found"; then exit 1; fi
            /opt/purr/purr sys
          '
          docker run --rm -v "$PWD/artifacts/cli:/opt/purr:ro" "$image" /opt/purr/purr sys --json > purr-sys.json
          jq -e '.backends.cpu | objects | has("Available")' purr-sys.json > /dev/null \
            || { echo "::error::the CPU backend is not available"; exit 1; }
          for expectation in ${{ matrix.expect_missing }}; do
            backend="${expectation%%=*}"
            library="${expectation#*=}"
            jq -e --arg backend "$backend" --arg library "$library" \
              '(.backends[$backend] | objects | .RuntimeLibraryMissing.library) == $library' purr-sys.json > /dev/null \
              || { echo "::error::$backend is not reported as missing $library"; exit 1; }
          done
      - name: Archive CLI
        uses: actions/upload-artifact@v7
        with:
          name: purr-cli-linux-x64-${{ matrix.variant }}
          path: artifacts/cli/
          retention-days: 30

  desktop-linux:
    name: desktop (linux, all)
    needs: [ffmpeg-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # without it the app links libcuda.so.1 and does not start without the NVIDIA driver
      GGML_CUDA_NO_VMM: "ON"
      FEATURES: static-ffmpeg,cuda,vulkan
      DEFERRED_LIBS: libcuda.so.1 libvulkan.so.1
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang curl pkg-config gcc ca-certificates openssl libssl-dev cmake libc6-dev make wget fuse libfuse2 \
            llvm patchelf \
            libgtk-3-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-linux
      - uses: ./.github/actions/setup-cuda-linux
        with:
          version: ${{ env.CUDA_VERSION }}
      - uses: ./.github/actions/setup-vulkan
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # whisper-rs-sys does not rebuild ggml when GGML_* or the GPU SDKs change, so each configuration needs its own cache
          key: all-ggml-native-${{ env.GGML_NATIVE }}-no-vmm-${{ env.GGML_CUDA_NO_VMM }}-cuda-${{ env.CUDA_VERSION }}-vulkan-${{ env.VULKAN_SDK_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: ./.github/actions/setup-dioxus
        with:
          version: ${{ env.DIOXUS_VERSION }}
      - name: Build the desktop package
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/lib:$ORIGIN/../lib/purr-desktop --cfg=web_sys_unstable_apis
        run: |
          dx bundle -p purr-app --release --linux --package-types deb \
            --out-dir dist-linux \
            --features "$FEATURES"
      - name: Build the desktop AppImage
        continue-on-error: true
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/lib:$ORIGIN/../lib/purr-desktop --cfg=web_sys_unstable_apis
        run: |
          dx bundle -p purr-app --release --linux --package-types appimage \
            --out-dir dist-appimage \
            --features "$FEATURES"
          images=(dist-appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ] && [ -f "${images[0]}" ] || { echo "::error::expected one AppImage"; exit 1; }
          image="$(realpath "${images[0]}")"
          check="$RUNNER_TEMP/appimage-check"
          rm -rf "$check"
          mkdir -p "$check"
          chmod +x "$image"
          (cd "$check" && "$image" --appimage-extract >/dev/null)
          app="$check/squashfs-root/usr/bin/purr-app"
          env -u LD_LIBRARY_PATH ldd "$app"
          if env -u LD_LIBRARY_PATH ldd "$app" | grep -F "not found"; then
            echo "::error::the AppImage has unresolved libraries"
            exit 1
          fi
          for file in "$app" "$check"/squashfs-root/usr/lib/*.so*; do
            [ -f "$file" ] || continue
            for library in $DEFERRED_LIBS; do
              if patchelf --print-needed "$file" | grep -qxF "$library"; then
                echo "::error file=$file::$file has a hard dependency on $library"
                exit 1
              fi
            done
          done
          cp "$image" dist-linux/
      - name: Add the CUDA runtime to the desktop package
        run: |
          debs=(dist-linux/*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one .deb, found ${debs[*]}"; exit 1; }
          deb="${debs[0]}"
          root="$RUNNER_TEMP/deb-root"
          rm -rf "$root"
          dpkg-deb -R "$deb" "$root"
          [ -f "$root/usr/bin/purr-app" ] || { echo "::error::usr/bin/purr-app missing from $deb"; exit 1; }
          mkdir -p "$root/usr/lib/purr-desktop"
          ldd "$root/usr/bin/purr-app" | awk '/lib(cudart|cublas|cublasLt)\.so/ { print $3 }' | xargs -r -I{} cp -L {} "$root/usr/lib/purr-desktop/"
          ls -l "$root/usr/lib/purr-desktop"
          (cd "$root" && find usr -type f -exec md5sum {} + > DEBIAN/md5sums)
          installed_size="$(du -sk --exclude=DEBIAN "$root" | cut -f1)"
          sed -i "s/^Installed-Size: .*/Installed-Size: $installed_size/" "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" "$deb"
          dpkg-deb --info "$deb"
      - name: Check the desktop package
        run: |
          root="$RUNNER_TEMP/deb-check"
          rm -rf "$root"
          dpkg-deb -x dist-linux/*.deb "$root"
          app="$root/usr/bin/purr-app"
          env -u LD_LIBRARY_PATH ldd "$app"
          if env -u LD_LIBRARY_PATH ldd "$app" | grep -F "not found"; then
            echo "::error::the packaged desktop app has unresolved libraries"
            exit 1
          fi
          status=0
          for file in "$app" "$root"/usr/lib/purr-desktop/*; do
            [ -f "$file" ] || continue
            for library in $DEFERRED_LIBS; do
              if patchelf --print-needed "$file" | grep -qxF "$library"; then
                echo "::error file=$file::$file has a hard dependency on $library"
                status=1
              fi
            done
          done
          exit $status
      - name: Archive desktop app
        uses: actions/upload-artifact@v7
        with:
          name: purr-desktop-linux-x64-all
          path: |
            dist-linux/*.deb
            dist-linux/*.AppImage
          if-no-files-found: error
          retention-days: 30

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: web
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: ./.github/actions/setup-dioxus
        with:
          version: ${{ env.DIOXUS_VERSION }}
      - name: Build the web app
        run: |
          dx bundle --verbose -p purr-app --release --web --out-dir dist-web
      - name: Archive web artifacts
        uses: actions/upload-artifact@v7
        with:
          name: purr-web
          path: dist-web/
          if-no-files-found: error

  cli-macos:
    name: cli (macos, ${{ matrix.backend == 'none' && 'cpu' || matrix.backend }})
    needs: [ffmpeg-macos]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GGML_CPU_ARM_ARCH: armv8.2-a+dotprod+fp16
    strategy:
      fail-fast: false
      matrix:
        backend: ["none", "metal"]
        include:
          - backend: "metal"
            is_release: true
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          brew uninstall cmake || true
          brew install cmake nasm autoconf automake libtool pkg-config
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: arm64-osx
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # whisper-rs-sys does not rebuild ggml when GGML_* changes, so each ggml configuration needs its own cache
          key: ${{ matrix.backend }}-ggml-native-${{ env.GGML_NATIVE }}-arm-${{ env.GGML_CPU_ARM_ARCH }}
          save-if: ${{ github.ref == 'refs/heads/develop' && matrix.is_release == true }}
      - name: Build the CLI
        run: |
          export CFLAGS="-march=armv8.2-a+crypto+noi8mm"
          export CXXFLAGS="-march=armv8.2-a+crypto+noi8mm"
          cargo build -p purr-cli --release --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Prepare CLI artifact
        run: |
          mkdir -p artifacts/cli
          cp target/release/purr artifacts/cli/purr
          echo "$(git describe --tags --always --dirty)" > artifacts/cli/VERSION
      - name: Archive CLI
        uses: actions/upload-artifact@v7
        with:
          name: purr-${{ matrix.is_release == true && 'cli' || 'dev-cli' }}-macos-arm64-${{ matrix.backend == 'none' && 'cpu' || matrix.backend }}
          path: artifacts/cli/
          retention-days: ${{ matrix.is_release == true && 30 || 7 }}

  desktop-macos:
    name: desktop (macos, metal)
    needs: [ffmpeg-macos]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GGML_CPU_ARM_ARCH: armv8.2-a+dotprod+fp16
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          brew uninstall cmake || true
          brew install cmake nasm autoconf automake libtool pkg-config
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: arm64-osx
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # whisper-rs-sys does not rebuild ggml when GGML_* changes, so each ggml configuration needs its own cache
          key: metal-ggml-native-${{ env.GGML_NATIVE }}-arm-${{ env.GGML_CPU_ARM_ARCH }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: ./.github/actions/setup-dioxus
        with:
          version: ${{ env.DIOXUS_VERSION }}
      - name: Build the desktop app
        run: |
          export CFLAGS="-march=armv8.2-a+crypto+noi8mm"
          export CXXFLAGS="-march=armv8.2-a+crypto+noi8mm"
          dx bundle -p purr-app --release --macos \
            --out-dir dist-macos \
            --features static-ffmpeg,metal
      - name: Archive desktop app
        uses: actions/upload-artifact@v7
        with:
          name: purr-desktop-macos-arm64-metal
          path: dist-macos/*.dmg
          if-no-files-found: error
          retention-days: 30

  cli-windows:
    name: cli (windows, ${{ matrix.backend == 'none' && 'cpu' || matrix.label || matrix.backend }})
    needs: [ffmpeg-windows]
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: D:\t
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(inputs.windows_single_backends && '["none","cuda","vulkan","cuda,vulkan"]' || '["none","cuda,vulkan"]') }}
        include:
          - backend: "cuda,vulkan"
            label: cuda-vulkan
            is_release: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-msvc
        with:
          vs-major: "18"
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-windows-static
      - if: contains(matrix.backend, 'cuda')
        uses: ./.github/actions/setup-cuda-windows
        with:
          version: ${{ env.CUDA_VERSION }}
      - if: contains(matrix.backend, 'vulkan')
        uses: ./.github/actions/setup-vulkan
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # rust-cache joins the target onto the workspace path, and CARGO_TARGET_DIR is D:\t
          workspaces: ". -> ../../../t"
          # whisper-rs-sys does not rebuild ggml when GGML_* or the GPU SDKs change, so each configuration needs its own cache
          key: ${{ matrix.label || matrix.backend }}-ggml-native-${{ env.GGML_NATIVE }}-crt-static-cuda-${{ env.CUDA_VERSION }}-vulkan-${{ env.VULKAN_SDK_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/develop' && matrix.is_release == true }}
      - name: Build the CLI
        run: |
          cargo build -p purr-cli --release --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Prepare CLI artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\cli
          Copy-Item "$env:CARGO_TARGET_DIR\release\purr.exe" artifacts\cli\purr.exe
          Get-ChildItem "$env:CARGO_TARGET_DIR\release\*.dll" | Copy-Item -Destination artifacts\cli\
          if ("${{ matrix.backend }}" -match "cuda") {
            $cudaBinPath = "$env:CUDA_PATH\bin\x64"
            foreach ($pattern in "cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll") {
              $found = Get-ChildItem "$cudaBinPath\$pattern"
              if (-Not $found) {
                Write-Error "CUDA runtime DLL not found: $cudaBinPath\$pattern"
                exit 1
              }
              $found | Copy-Item -Destination artifacts\cli\
            }
          }
          git describe --tags --always --dirty | Out-File -FilePath artifacts\cli\VERSION.txt -Encoding utf8
      - name: Check the CLI does not import the deferred libraries
        run: |
          ./scripts/check-windows-imports.ps1 -Exe artifacts\cli\purr.exe -Forbidden '^nvcuda\.dll$','^cudart64_','^cublas','^vulkan-1\.dll$'
      - name: Check the CLI starts without GPU runtimes
        run: |
          $expect = @{
            ExpectCuda = "${{ matrix.backend }}" -match 'cuda'
            ExpectVulkan = "${{ matrix.backend }}" -match 'vulkan'
          }
          ./scripts/check-windows-sys.ps1 -Exe artifacts\cli\purr.exe @expect
      - name: Archive CLI
        uses: actions/upload-artifact@v7
        with:
          name: purr-${{ matrix.is_release == true && 'cli' || 'dev-cli' }}-windows-x64-${{ matrix.backend == 'none' && 'cpu' || matrix.label || matrix.backend }}
          path: artifacts/cli/
          retention-days: ${{ matrix.is_release == true && 30 || 7 }}

  desktop-windows:
    name: desktop (windows, cuda-vulkan)
    needs: [ffmpeg-windows]
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: D:\t
      FEATURES: static-ffmpeg,cuda,vulkan
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-msvc
        with:
          vs-major: "18"
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-windows-static
      - uses: ./.github/actions/setup-cuda-windows
        with:
          version: ${{ env.CUDA_VERSION }}
      - uses: ./.github/actions/setup-vulkan
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # rust-cache joins the target onto the workspace path, and CARGO_TARGET_DIR is D:\t
          workspaces: ". -> ../../../t"
          # whisper-rs-sys does not rebuild ggml when GGML_* or the GPU SDKs change, so each configuration needs its own cache
          key: cuda-vulkan-ggml-native-${{ env.GGML_NATIVE }}-crt-static-cuda-${{ env.CUDA_VERSION }}-vulkan-${{ env.VULKAN_SDK_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: ./.github/actions/setup-dioxus
        with:
          version: ${{ env.DIOXUS_VERSION }}
      - name: Build the desktop app
        run: |
          dx bundle --verbose --trace -p purr-app --release --profile r --windows --package-types nsis --out-dir dist-windows --features $env:FEATURES
      - name: Prepare desktop artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\desktop
          Copy-Item dist-windows\*-setup.exe artifacts\desktop\

          $appExe = Get-ChildItem "$env:CARGO_TARGET_DIR\dx\purr-app" -Recurse -Filter purr-app.exe |
            Where-Object { $_.FullName -notmatch '\\bundle\\' } | Select-Object -First 1
          if (-Not $appExe) {
            Write-Error "dx app directory not found under $env:CARGO_TARGET_DIR\dx\purr-app"
            exit 1
          }
          ./scripts/check-windows-imports.ps1 -Exe $appExe.FullName -Forbidden '^nvcuda\.dll$','^cudart64_','^cublas','^vulkan-1\.dll$'
          $portable = "artifacts\portable\purr-desktop"
          New-Item -ItemType Directory -Force -Path $portable
          Copy-Item "$($appExe.DirectoryName)\*" $portable -Recurse
          Get-ChildItem "$env:CARGO_TARGET_DIR\r\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $portable
          $cudaBinPath = "$env:CUDA_PATH\bin\x64"
          foreach ($pattern in "cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll") {
            $found = Get-ChildItem "$cudaBinPath\$pattern"
            if (-Not $found) {
              Write-Error "CUDA runtime DLL not found: $cudaBinPath\$pattern"
              exit 1
            }
            $found | Copy-Item -Destination $portable
          }
          Compress-Archive -Path "$portable\*" -DestinationPath artifacts\desktop\purr-desktop-portable.zip
      - name: Archive desktop app
        uses: actions/upload-artifact@v7
        with:
          name: purr-desktop-windows-x64-cuda-vulkan
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 30

  deploy-web:
    name: deploy web (vercel)
    runs-on: ubuntu-24.04
    needs: [web]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./dist-web
      - name: Setup Vercel Output Directory
        run: |
          mkdir -p .vercel/output/static
          cp -r ./dist-web/public/* .vercel/output/static/
          cp res/vercel-config.json .vercel/output/config.json
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Setup Environment
        id: setup-env
        run: |
          # set the environment to preview by default, and production if needed
          ENVIRONMENT="preview"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          vercel pull --yes --environment=$ENVIRONMENT --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: |
          vercel --yes ${{ steps.setup-env.outputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --prebuilt

  nightly-release:
    name: release (nightly)
    runs-on: ubuntu-24.04
    # Only run for scheduled nightly builds or manual trigger with nightly input
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly == true)
    needs: [cli-linux, desktop-linux, web, cli-macos, desktop-macos, cli-windows, desktop-windows]
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: nightly-${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for tags

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Get previous nightly tag
        id: prev_tag
        run: |
          # Find the most recent nightly tag
          PREV_TAG=$(git tag -l 'nightly-*' --sort=-version:refname | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            # If no nightly tag exists, use the most recent tag
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6.5
        with:
          configuration: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "feat", "enhancement"]
                },
                {
                  "title": "## 🐛 Bug Fixes",
                  "labels": ["fix", "bugfix", "bug"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test", "testing"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["docs", "documentation"]
                },
                {
                  "title": "## 🏗️ Refactoring",
                  "labels": ["refactor", "refactoring"]
                },
                {
                  "title": "## 🎨 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🔧 Maintenance",
                  "labels": ["chore", "ci", "build", "deps"]
                }
              ],
              "template": "# Nightly Build - ${{ steps.date.outputs.date }}\n\n#{{CHANGELOG}}\n\n## 📊 Uncategorized Changes\n#{{UNCATEGORIZED}}\n\n---\n*This is an automated nightly build. It may be unstable.*\n\n## 📦 Build Information\n- Linux x64: CUDA + Vulkan backends in one build (falls back to CPU without a GPU runtime), plus CPU-only, Vulkan-only and CUDA-only builds\n- macOS Apple Silicon: Metal backend\n- Windows x64: CUDA + Vulkan backends (falls back to CPU without a GPU runtime)\n- Each platform ships the command-line tool and the desktop app separately",
              "pr_template": "- #{{TITLE}} (#{{NUMBER}}) @#{{AUTHOR}}"
            }
          fromTag: ${{ steps.prev_tag.outputs.tag }}
          toTag: HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CLI Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: purr-cli-*
          path: ./release-artifacts

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: purr-desktop-*
          path: ./release-artifacts

      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./release-artifacts/purr-web

      - name: Package Release Assets
        run: bash scripts/package-release-assets.sh

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}
          name: Nightly Build - ${{ steps.date.outputs.date }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📥 Downloads

            ### Desktop app
            - Windows: `purr-desktop-windows-x64-cuda-vulkan-setup.exe` (installer, Vulkan and CPU) or `purr-desktop-windows-x64-cuda-vulkan-portable.zip` (includes the CUDA runtime DLLs).
            - macOS (Apple Silicon): `purr-desktop-macos-arm64-metal.dmg`
            - Linux: `purr-desktop-linux-x64-all.deb` (Debian, Ubuntu and derivatives; an `.AppImage` is attached when it could be built). Includes the CUDA runtime: uses an NVIDIA GPU when the NVIDIA driver is installed, otherwise Vulkan, otherwise the CPU.

            ### Command-line tool
            - Windows: `purr-cli-windows-x64-cuda-vulkan.zip`. Extract all files to one folder. Uses an NVIDIA GPU (CUDA) when the CUDA runtime is present, otherwise Vulkan, otherwise the CPU. Needs an x86-64 CPU with AVX2.
              - `purr-runtime-cuda-windows-x64.zip`: the NVIDIA cuBLAS libraries (CUDA runtime) for `purr` and the desktop app. ${{ env.PURR_SPLIT_CUDA_RUNTIME == 'true' && 'Not part of the other Windows downloads: extract it into `%LOCALAPPDATA%\purr\runtime` or next to `purr.exe` to enable CUDA.' || 'Already part of the other Windows downloads; only needed to share one copy: extract it into `%LOCALAPPDATA%\purr\runtime`.' }} `purr runtime status` shows where the libraries are looked for.
            - macOS (Apple Silicon): `purr-cli-macos-arm64-metal.tar.gz`
            - Linux: `purr-cli-linux-x64-all.tar.gz` (recommended). Keep the `lib` folder next to `purr`. Uses an NVIDIA GPU (CUDA) when the NVIDIA driver is installed, otherwise Vulkan, otherwise the CPU.
              - `purr-cli-linux-x64-vulkan.tar.gz`: smaller, for AMD and Intel GPUs. Uses Vulkan when a Vulkan driver is installed, otherwise the CPU.
              - `purr-cli-linux-x64-cpu.tar.gz`: smallest, CPU only.
              - `purr-cli-linux-x64-cuda.tar.gz`: NVIDIA only. Keep the `lib` folder next to `purr`. Does not start without the NVIDIA driver.
              - All Linux builds need an x86-64 CPU with AVX2 (2013 or later).

            ### Web
            `purr-web.tar.gz` for web deployment.

            ### Checksums
            Verify your download with `SHA256SUMS.txt`
          prerelease: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old nightly releases
        run: |
          # Keep only the last 7 nightly releases
          NIGHTLY_TAGS=$(git tag -l 'nightly-*' --sort=-version:refname | tail -n +8)
          if [ ! -z "$NIGHTLY_TAGS" ]; then
            for tag in $NIGHTLY_TAGS; do
              echo "Deleting old nightly release: $tag"
              gh release delete "$tag" --yes || true
              git push --delete origin "$tag" || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tagged-release:
    name: release (tag)
    runs-on: ubuntu-24.04
    # Only run on version tags (e.g., v1.0.0, v2.1.3-beta)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [cli-linux, desktop-linux, web, cli-macos, desktop-macos, cli-windows, desktop-windows]
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Check if this is a prerelease
          if [[ "$VERSION" == *"-"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6.5
        with:
          configuration: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "feat", "enhancement"]
                },
                {
                  "title": "## 🐛 Bug Fixes",
                  "labels": ["fix", "bugfix", "bug"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test", "testing"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["docs", "documentation"]
                },
                {
                  "title": "## 🏗️ Refactoring",
                  "labels": ["refactor", "refactoring"]
                },
                {
                  "title": "## 🎨 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🔧 Maintenance",
                  "labels": ["chore", "ci", "build", "deps"]
                },
                {
                  "title": "## ⚠️ Breaking Changes",
                  "labels": ["breaking", "breaking-change"]
                }
              ],
              "template": "# Release ${{ steps.version.outputs.version }}\n\n#{{CHANGELOG}}\n\n## 📦 Build Information\n- Linux x64: CUDA + Vulkan backends in one build (falls back to CPU without a GPU runtime), plus CPU-only, Vulkan-only and CUDA-only builds\n- macOS Apple Silicon: Metal backend\n- Windows x64: CUDA + Vulkan backends (falls back to CPU without a GPU runtime)\n- Each platform ships the command-line tool and the desktop app separately",
              "pr_template": "- #{{TITLE}} (#{{NUMBER}}) @#{{AUTHOR}}"
            }
          toTag: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CLI Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: purr-cli-*
          path: ./release-artifacts

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: purr-desktop-*
          path: ./release-artifacts

      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./release-artifacts/purr-web

      - name: Package Release Assets
        run: bash scripts/package-release-assets.sh "${{ steps.version.outputs.version }}"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          name: Purr ${{ steps.version.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📥 Downloads

            Replace `VERSION` with `${{ steps.version.outputs.version }}` in the file names below.

            ### Desktop app
            - Windows: `purr-VERSION-desktop-windows-x64-cuda-vulkan-setup.exe` (installer, Vulkan and CPU) or `purr-VERSION-desktop-windows-x64-cuda-vulkan-portable.zip` (includes the CUDA runtime DLLs)
            - macOS (Apple Silicon): `purr-VERSION-desktop-macos-arm64-metal.dmg`
            - Linux: `purr-VERSION-desktop-linux-x64-all.deb` (an `.AppImage` is attached when it could be built). Includes the CUDA runtime: uses an NVIDIA GPU when the NVIDIA driver is installed, otherwise Vulkan, otherwise the CPU.

            ### Command-line tool
            - Windows: `purr-VERSION-cli-windows-x64-cuda-vulkan.zip`. Extract all files to one folder. Needs an x86-64 CPU with AVX2.
              - `purr-VERSION-runtime-cuda-windows-x64.zip`: the NVIDIA cuBLAS libraries (CUDA runtime). ${{ env.PURR_SPLIT_CUDA_RUNTIME == 'true' && 'Not part of the other Windows downloads: extract it into `%LOCALAPPDATA%\purr\runtime` or next to `purr.exe` to enable CUDA.' || 'Already part of the other Windows downloads; only needed to share one copy: extract it into `%LOCALAPPDATA%\purr\runtime`.' }}
            - macOS (Apple Silicon): `purr-VERSION-cli-macos-arm64-metal.tar.gz`
            - Linux: `purr-VERSION-cli-linux-x64-all.tar.gz` (recommended). Keep the `lib` folder next to `purr`. Uses CUDA, otherwise Vulkan, otherwise the CPU.
              - `purr-VERSION-cli-linux-x64-vulkan.tar.gz`: smaller, Vulkan otherwise the CPU.
              - `purr-VERSION-cli-linux-x64-cpu.tar.gz`: smallest, CPU only.
              - `purr-VERSION-cli-linux-x64-cuda.tar.gz`: NVIDIA only; does not start without the NVIDIA driver.
              - All Linux builds need an x86-64 CPU with AVX2 (2013 or later).

            ### Web
            `purr-VERSION-web.tar.gz` for deployment.

            ## 🔒 Verification
            Verify downloads using the provided `SHA256SUMS.txt`
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nightly-packages:
    name: publish packages (nightly)
    needs: [nightly-release]
    permissions:
      contents: read
    uses: ./.github/workflows/publish-packages.yml
    with:
      channel: nightly
      tag: ${{ needs.nightly-release.outputs.tag }}
    secrets:
      PURR_TAP_DEPLOY_KEY: ${{ secrets.PURR_TAP_DEPLOY_KEY }}
      PURR_BUCKET_DEPLOY_KEY: ${{ secrets.PURR_BUCKET_DEPLOY_KEY }}

  publish-release-packages:
    name: publish packages (stable)
    needs: [tagged-release]
    if: needs.tagged-release.outputs.prerelease == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-packages.yml
    with:
      channel: stable
      tag: ${{ needs.tagged-release.outputs.tag }}
    secrets:
      PURR_TAP_DEPLOY_KEY: ${{ secrets.PURR_TAP_DEPLOY_KEY }}
      PURR_BUCKET_DEPLOY_KEY: ${{ secrets.PURR_BUCKET_DEPLOY_KEY }}

  prune-caches:
    name: prune caches
    if: ${{ !cancelled() && github.ref == 'refs/heads/develop' }}
    needs: [cli-linux, desktop-linux, web, cli-macos, desktop-macos, cli-windows, desktop-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete the Rust caches superseded by a newer one of the same job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache list --ref refs/heads/develop --key v0-rust- --limit 1000 --json id,key,createdAt \
            | jq -r 'group_by(.key | sub("-[0-9a-f]{8}-[0-9a-f]{8}$"; ""))
                     | map(sort_by(.createdAt) | reverse | .[1:][])
                     | .[] | "\(.id) \(.key)"' \
            | while read -r id key; do
                echo "deleting $key"
                gh cache delete "$id"
              done
