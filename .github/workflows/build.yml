# https://github.com/zmwangx/rust-ffmpeg/blob/master/.github/workflows/build.yml

name: build
on:
  push:
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Create nightly release"
        required: false
        default: false
        type: boolean

env:
  DIOXUS_VERSION: 0.8.0-alpha.3
  VCPKG_COMMIT: efecf268f3a3ec78f4bf1f0c36759bdb23c6f653
  VCPKG_FFMPEG: ffmpeg[core,avcodec,avformat,swresample]
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build-linux:
    name: Build Linux - ${{ matrix.variant }}
    runs-on: ubuntu-latest
    env:
      GGML_NATIVE: "OFF"
      GGML_CUDA_NO_VMM: ${{ matrix.cuda_no_vmm && 'ON' || 'OFF' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            features: static-ffmpeg
            portable: true
            web: true
          - variant: vulkan
            features: static-ffmpeg,vulkan
            portable: true
            deferred_libs: libvulkan.so.1
            expect_missing: Vulkan=libvulkan.so.1
          - variant: cuda
            features: static-ffmpeg,cuda
          - variant: all
            features: static-ffmpeg,cuda,vulkan
            cuda_no_vmm: true
            portable: true
            desktop: true
            deferred_libs: libcuda.so.1 libvulkan.so.1
            expect_missing: CUDA=libcuda.so.1 Vulkan=libvulkan.so.1
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends clang curl pkg-config gcc ca-certificates openssl libssl-dev cmake libc6-dev make wget fuse libfuse2 \
            nasm autoconf automake libtool \
            llvm patchelf \
            libgtk-3-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-ffmpeg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}
      - name: Install FFmpeg (static)
        run: |
          VCPKG_DIR="$RUNNER_TEMP/vcpkg"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg "$VCPKG_DIR"
          git -C "$VCPKG_DIR" checkout --quiet "$VCPKG_COMMIT"
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_DIR/vcpkg" install "$VCPKG_FFMPEG:x64-linux"
          echo "PKG_CONFIG_PATH=$VCPKG_DIR/installed/x64-linux/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install cuda
        if: contains(matrix.features, 'cuda')
        run: |
          CUDA_REPO="ubuntu$(lsb_release -rs | tr -d '.')"
          CUDA_VERSION="13-5"
          CUDA_PATH_VERSION="13.5"

          wget https://developer.download.nvidia.com/compute/cuda/repos/${CUDA_REPO}/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt update
          sudo apt install -y cuda-toolkit-${CUDA_VERSION}
          CUDA_PATH=/usr/local/cuda-${CUDA_PATH_VERSION}/
          echo "CUDA_PATH=$CUDA_PATH" >> $GITHUB_ENV
          echo "$CUDA_PATH/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV
      - name: Install Vulkan SDK
        if: contains(matrix.features, 'vulkan')
        run: |
          # Install Vulkan SDK using system packages for Ubuntu 24.04
          sudo apt update
          sudo apt install -y libvulkan-dev vulkan-tools vulkan-utility-libraries-dev spirv-tools
          # Download and install latest Vulkan SDK manually
          VULKAN_SDK_VERSION="1.4.363.1"
          wget https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz
          tar -xf vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz
          export VULKAN_SDK="$(pwd)/${VULKAN_SDK_VERSION}/x86_64"
          echo "VULKAN_SDK=$VULKAN_SDK" >> $GITHUB_ENV
          echo "$VULKAN_SDK/bin" >> $GITHUB_PATH
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # whisper-rs-sys does not rebuild ggml when GGML_* changes, so each ggml configuration needs its own cache
          key: ${{ matrix.variant }}-ggml-native-${{ env.GGML_NATIVE }}-no-vmm-${{ env.GGML_CUDA_NO_VMM }}
      - name: Cache Dioxus CLI
        id: cache-dx-linux
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: dioxus-cli-${{ runner.os }}-${{ env.DIOXUS_VERSION }}
      - name: Install Dioxus CLI
        if: steps.cache-dx-linux.outputs.cache-hit != 'true'
        run: |
          cargo install dioxus-cli --version ${{ env.DIOXUS_VERSION }} --locked
      - name: Build CLI - ${{ matrix.variant }}
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/lib:$ORIGIN/../lib/purr-desktop --cfg=web_sys_unstable_apis
        run: |
          cargo build -p purr-cli --release --features ${{ matrix.features }}
      - name: Prepare CLI artifact
        run: |
          mkdir -p artifacts/cli
          cp target/release/purr artifacts/cli/purr
          if [ "${{ contains(matrix.features, 'cuda') }}" = "true" ]; then
            mkdir -p artifacts/cli/lib
            ldd target/release/purr | awk '/lib(cudart|cublas|cublasLt)\.so/ { print $3 }' | xargs -r -I{} cp -L {} artifacts/cli/lib/
          fi
          echo "$(git describe --tags --always --dirty)" > artifacts/cli/VERSION
          ls -lR artifacts/cli
      - name: Check the CLI does not need the deferred libraries
        if: matrix.deferred_libs
        run: |
          status=0
          for file in artifacts/cli/purr artifacts/cli/lib/*; do
            [ -f "$file" ] || continue
            echo "$file needs: $(patchelf --print-needed "$file" | tr '\n' ' ')"
            for library in ${{ matrix.deferred_libs }}; do
              if patchelf --print-needed "$file" | grep -qxF "$library"; then
                echo "::error file=$file::$file has a hard dependency on $library"
                status=1
              fi
            done
          done
          exit $status
      - name: Run the CLI on the runner
        if: matrix.portable
        run: |
          artifacts/cli/purr sys || echo "::warning::purr sys failed on the runner"
      - name: Check the CLI starts on a bare Ubuntu without GPU runtimes
        if: matrix.portable
        run: |
          docker run --rm -v "$PWD/artifacts/cli:/opt/purr:ro" ubuntu:24.04 sh -c '
            set -e
            ldd /opt/purr/purr
            if ldd /opt/purr/purr | grep -F "not found"; then exit 1; fi
            /opt/purr/purr sys
          ' | sed -E 's/\x1b\[[0-9;]*m//g; s/^ +//; s/ +/ /g' | tee purr-sys.txt
          grep -qxF '* CPU - Available' purr-sys.txt || { echo "::error::the CPU backend is not available"; exit 1; }
          for expectation in ${{ matrix.expect_missing }}; do
            backend="${expectation%%=*}"
            library="${expectation#*=}"
            grep -qxF "* $backend - Built, but the runtime library $library cannot be loaded" purr-sys.txt \
              || { echo "::error::$backend is not reported as missing $library"; exit 1; }
          done
      - name: Build desktop app - ${{ matrix.variant }}
        if: matrix.desktop
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/lib:$ORIGIN/../lib/purr-desktop --cfg=web_sys_unstable_apis
        run: |
          dx bundle -p purr-app --release --linux --package-types deb \
            --out-dir dist-linux \
            --features ${{ matrix.features }}
      - name: Build desktop AppImage - ${{ matrix.variant }}
        if: matrix.desktop
        continue-on-error: true
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/lib:$ORIGIN/../lib/purr-desktop --cfg=web_sys_unstable_apis
        run: |
          dx bundle -p purr-app --release --linux --package-types appimage \
            --out-dir dist-appimage \
            --features ${{ matrix.features }}
          ls -l dist-appimage
          cp dist-appimage/*.AppImage dist-linux/
      - name: Add the CUDA runtime to the desktop package
        if: matrix.desktop && contains(matrix.features, 'cuda')
        run: |
          debs=(dist-linux/*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one .deb, found ${debs[*]}"; exit 1; }
          deb="${debs[0]}"
          root="$RUNNER_TEMP/deb-root"
          rm -rf "$root"
          dpkg-deb -R "$deb" "$root"
          [ -f "$root/usr/bin/purr-app" ] || { echo "::error::usr/bin/purr-app missing from $deb"; exit 1; }
          mkdir -p "$root/usr/lib/purr-desktop"
          ldd "$root/usr/bin/purr-app" | awk '/lib(cudart|cublas|cublasLt)\.so/ { print $3 }' | xargs -r -I{} cp -L {} "$root/usr/lib/purr-desktop/"
          ls -l "$root/usr/lib/purr-desktop"
          (cd "$root" && find usr -type f -exec md5sum {} + > DEBIAN/md5sums)
          installed_size="$(du -sk --exclude=DEBIAN "$root" | cut -f1)"
          sed -i "s/^Installed-Size: .*/Installed-Size: $installed_size/" "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" "$deb"
          dpkg-deb --info "$deb"
      - name: Check the desktop package
        if: matrix.desktop
        run: |
          root="$RUNNER_TEMP/deb-check"
          rm -rf "$root"
          dpkg-deb -x dist-linux/*.deb "$root"
          app="$root/usr/bin/purr-app"
          env -u LD_LIBRARY_PATH ldd "$app"
          if env -u LD_LIBRARY_PATH ldd "$app" | grep -F "not found"; then
            echo "::error::the packaged desktop app has unresolved libraries"
            exit 1
          fi
          status=0
          for file in "$app" "$root"/usr/lib/purr-desktop/*; do
            [ -f "$file" ] || continue
            for library in ${{ matrix.deferred_libs }}; do
              if patchelf --print-needed "$file" | grep -qxF "$library"; then
                echo "::error file=$file::$file has a hard dependency on $library"
                status=1
              fi
            done
          done
          exit $status
      - name: Build Dioxus web
        if: matrix.web
        run: |
          dx bundle --verbose -p purr-app --release --web --out-dir dist-web
      - name: Archive CLI
        uses: actions/upload-artifact@v7
        with:
          name: purr-cli-linux-x64-${{ matrix.variant }}
          path: artifacts/cli/
          retention-days: 30
      - name: Archive desktop app
        if: matrix.desktop
        uses: actions/upload-artifact@v7
        with:
          name: purr-desktop-linux-x64-${{ matrix.variant }}
          path: |
            dist-linux/*.deb
            dist-linux/*.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: Archive web artifacts
        if: matrix.web
        uses: actions/upload-artifact@v7
        with:
          name: purr-web
          path: dist-web/

  build-macos:
    name: Build macOS ${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ["none", "metal"]
        include:
          - backend: "metal"
            is_release: true
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          brew uninstall cmake || true
          brew install cmake nasm autoconf automake libtool pkg-config
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-ffmpeg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}
      - name: Install FFmpeg (static)
        run: |
          VCPKG_DIR="$RUNNER_TEMP/vcpkg"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg "$VCPKG_DIR"
          git -C "$VCPKG_DIR" checkout --quiet "$VCPKG_COMMIT"
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_DIR/vcpkg" install "$VCPKG_FFMPEG:arm64-osx"
          echo "PKG_CONFIG_PATH=$VCPKG_DIR/installed/arm64-osx/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache Dioxus CLI
        id: cache-dx-macos
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: dioxus-cli-${{ runner.os }}-${{ env.DIOXUS_VERSION }}
      - name: Install Dioxus CLI
        if: steps.cache-dx-macos.outputs.cache-hit != 'true'
        run: |
          cargo install dioxus-cli --version ${{ env.DIOXUS_VERSION }} --locked
      - name: Build CLI${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
        run: |
          export CFLAGS="-march=armv8.2-a+crypto+noi8mm"
          export CXXFLAGS="-march=armv8.2-a+crypto+noi8mm"
          cargo build -p purr-cli --release --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Build desktop app${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
        if: matrix.is_release == true
        run: |
          export CFLAGS="-march=armv8.2-a+crypto+noi8mm"
          export CXXFLAGS="-march=armv8.2-a+crypto+noi8mm"
          dx bundle -p purr-app --release --macos \
            --out-dir dist-macos \
            --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Prepare CLI artifact
        run: |
          mkdir -p artifacts/cli
          cp target/release/purr artifacts/cli/purr
          echo "$(git describe --tags --always --dirty)" > artifacts/cli/VERSION
      - name: Archive CLI
        uses: actions/upload-artifact@v7
        with:
          name: purr-${{ matrix.is_release == true && 'cli' || 'dev-cli' }}-macos-arm64-${{ matrix.backend == 'none' && 'cpu' || matrix.backend }}
          path: artifacts/cli/
          retention-days: ${{ matrix.is_release == true && 30 || 7 }}
      - name: Archive desktop app
        if: matrix.is_release == true
        uses: actions/upload-artifact@v7
        with:
          name: purr-desktop-macos-arm64-${{ matrix.backend }}
          path: dist-macos/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    defaults:
      run:
        shell: pwsh
    name: Build Windows${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: D:\t
    strategy:
      fail-fast: false
      matrix:
        backend: ["none", cuda, vulkan, "cuda,vulkan"]
        include:
          - backend: "cuda,vulkan"
            label: cuda-vulkan
            is_release: true # Mark CUDA + Vulkan as the release variant for Windows
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          $VCINSTALLDIR = $(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath)
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=${VCINSTALLDIR}\VC\Tools\LLVM\x64\bin`n"
          choco install -y cmake
          choco install -y visualstudio2022buildtools
          choco install -y visualstudio2022-workload-vctools
          choco install -y llvm
          choco install -y windows-sdk-10.0
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-ffmpeg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}
      - name: Install FFmpeg (static)
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP vcpkg
          git clone --quiet --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg $vcpkg
          git -C $vcpkg checkout --quiet $env:VCPKG_COMMIT
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkg\vcpkg.exe" install "$($env:VCPKG_FFMPEG):x64-windows-static-md"
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$vcpkg"
          Add-Content $env:GITHUB_ENV "VCPKGRS_TRIPLET=x64-windows-static-md"
      - name: Install cuda
        if: contains(matrix.backend, 'cuda')
        run: |
          choco install -r cuda --version 13.5.0
          $CUDA_PATH = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.5\"
          # check if CUDA_PATH exists
          if (-Not (Test-Path $CUDA_PATH)) {
              Write-Error "CUDA_PATH does not exist: $CUDA_PATH"
              exit 1
          }
          Add-Content $env:GITHUB_ENV "CUDA_PATH=${CUDA_PATH}"
          Add-Content $env:GITHUB_ENV "CUDA_PATH_V13_5=${CUDA_PATH}"
          Add-Content $env:GITHUB_ENV "CUDA_BIN_PATH=${CUDA_PATH}\bin"
          Add-Content $env:GITHUB_ENV "CUDA_LIB_PATH=${CUDA_PATH}\lib\x64"
          Add-Content $env:GITHUB_PATH "${CUDA_PATH}\bin\x64"
          Add-Content $env:GITHUB_PATH "${CUDA_PATH}\bin"
      - name: Install Vulkan SDK
        if: contains(matrix.backend, 'vulkan')
        run: |
          $VulkanSDKVersion = "1.4.363.1"
          $VulkanSDKUrl = "https://sdk.lunarg.com/sdk/download/${VulkanSDKVersion}/windows/vulkansdk-windows-X64-${VulkanSDKVersion}.exe"
          Invoke-WebRequest -Uri ${VulkanSDKUrl} -OutFile VulkanSDK-Installer.exe
          Start-Process -Wait -FilePath .\VulkanSDK-Installer.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install --root C:\VulkanSDK\${VulkanSDKVersion} --no-shortcuts --no-start-menu --no-desktop-icon --no-update-check"
          $VULKAN_SDK = "C:\VulkanSDK\${VulkanSDKVersion}"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=${VULKAN_SDK}"
          Add-Content $env:GITHUB_PATH "${VULKAN_SDK}\Bin"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Cache Dioxus CLI
        id: cache-dx-windows
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx.exe
          key: dioxus-cli-${{ runner.os }}-${{ env.DIOXUS_VERSION }}
      - name: Install Dioxus CLI
        if: steps.cache-dx-windows.outputs.cache-hit != 'true'
        run: |
          cargo install dioxus-cli --version ${{ env.DIOXUS_VERSION }} --locked
      - name: Install Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v3
      - name: Build CLI${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
        run: |
          cargo build -p purr-cli --release --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Build desktop app${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
        if: matrix.is_release == true
        run: |
          dx bundle --verbose --trace -p purr-app --release --profile r --windows --package-types nsis --out-dir dist-windows --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Prepare CLI artifact
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\cli
          Copy-Item "$env:CARGO_TARGET_DIR\release\purr.exe" artifacts\cli\purr.exe
          Get-ChildItem "$env:CARGO_TARGET_DIR\release\*.dll" | Copy-Item -Destination artifacts\cli\
          if ("${{ matrix.backend }}" -match "cuda") {
            $cudaBinPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.5\bin\x64"
            foreach ($pattern in "cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll") {
              $found = Get-ChildItem "$cudaBinPath\$pattern"
              if (-Not $found) {
                Write-Error "CUDA runtime DLL not found: $cudaBinPath\$pattern"
                exit 1
              }
              $found | Copy-Item -Destination artifacts\cli\
            }
          }
          git describe --tags --always --dirty | Out-File -FilePath artifacts\cli\VERSION.txt -Encoding utf8
      - name: Archive CLI
        uses: actions/upload-artifact@v7
        with:
          name: purr-${{ matrix.is_release == true && 'cli' || 'dev-cli' }}-windows-x64-${{ matrix.backend == 'none' && 'cpu' || matrix.label || matrix.backend }}
          path: artifacts/cli/
          retention-days: ${{ matrix.is_release == true && 30 || 7 }}
      - name: Prepare desktop artifacts
        if: matrix.is_release == true
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\desktop
          Copy-Item dist-windows\*-setup.exe artifacts\desktop\

          $appExe = Get-ChildItem "$env:CARGO_TARGET_DIR\dx\purr-app" -Recurse -Filter purr-app.exe |
            Where-Object { $_.FullName -notmatch '\\bundle\\' } | Select-Object -First 1
          if (-Not $appExe) {
            Write-Error "dx app directory not found under $env:CARGO_TARGET_DIR\dx\purr-app"
            exit 1
          }
          $portable = "artifacts\portable\purr-desktop"
          New-Item -ItemType Directory -Force -Path $portable
          Copy-Item "$($appExe.DirectoryName)\*" $portable -Recurse
          Get-ChildItem "$env:CARGO_TARGET_DIR\r\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination $portable
          if ("${{ matrix.backend }}" -match "cuda") {
            $cudaBinPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.5\bin\x64"
            foreach ($pattern in "cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll") {
              Get-ChildItem "$cudaBinPath\$pattern" | Copy-Item -Destination $portable
            }
          }
          Compress-Archive -Path "$portable\*" -DestinationPath artifacts\desktop\purr-desktop-portable.zip
      - name: Archive desktop app
        if: matrix.is_release == true
        uses: actions/upload-artifact@v7
        with:
          name: purr-desktop-windows-x64-${{ matrix.label || matrix.backend }}
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 30

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v7
      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./dist-web
      - name: Setup Vercel Output Directory
        run: |
          mkdir -p .vercel/output/static
          cp -r ./dist-web/public/* .vercel/output/static/
          cp res/vercel-config.json .vercel/output/config.json
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Setup Environment
        id: setup-env
        run: |
          # set the environment to preview by default, and production if needed
          ENVIRONMENT="preview"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          vercel pull --yes --environment=$ENVIRONMENT --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: |
          vercel --yes ${{ steps.setup-env.outputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --prebuilt

  nightly-release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    # Only run for scheduled nightly builds or manual trigger with nightly input
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly == true)
    needs: [build-linux, build-macos, build-windows]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for tags

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Get previous nightly tag
        id: prev_tag
        run: |
          # Find the most recent nightly tag
          PREV_TAG=$(git tag -l 'nightly-*' --sort=-version:refname | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            # If no nightly tag exists, use the most recent tag
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "feat", "enhancement"]
                },
                {
                  "title": "## 🐛 Bug Fixes",
                  "labels": ["fix", "bugfix", "bug"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test", "testing"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["docs", "documentation"]
                },
                {
                  "title": "## 🏗️ Refactoring",
                  "labels": ["refactor", "refactoring"]
                },
                {
                  "title": "## 🎨 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🔧 Maintenance",
                  "labels": ["chore", "ci", "build", "deps"]
                }
              ],
              "template": "# Nightly Build - ${{ steps.date.outputs.date }}\n\n#{{CHANGELOG}}\n\n## 📊 Uncategorized Changes\n#{{UNCATEGORIZED}}\n\n---\n*This is an automated nightly build. It may be unstable.*\n\n## 📦 Build Information\n- Linux x64: CUDA + Vulkan backends in one build (falls back to CPU without a GPU runtime), plus CPU-only, Vulkan-only and CUDA-only builds\n- macOS Apple Silicon: Metal backend\n- Windows x64: CUDA + Vulkan backends (falls back to CPU without a GPU runtime)\n- Each platform ships the command-line tool and the desktop app separately",
              "pr_template": "- #{{TITLE}} (#{{NUMBER}}) @#{{AUTHOR}}"
            }
          fromTag: ${{ steps.prev_tag.outputs.tag }}
          toTag: HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CLI Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: purr-cli-*
          path: ./release-artifacts

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: purr-desktop-*
          path: ./release-artifacts

      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./release-artifacts/purr-web

      - name: Package Release Assets
        run: bash scripts/package-release-assets.sh

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}
          name: Nightly Build - ${{ steps.date.outputs.date }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📥 Downloads

            ### Desktop app
            - Windows: `purr-desktop-windows-x64-cuda-vulkan-setup.exe` (installer, Vulkan and CPU) or `purr-desktop-windows-x64-cuda-vulkan-portable.zip` (includes the CUDA runtime DLLs).
            - macOS (Apple Silicon): `purr-desktop-macos-arm64-metal.dmg`
            - Linux: `purr-desktop-linux-x64-all.deb` (Debian, Ubuntu and derivatives; an `.AppImage` is attached when it could be built). Includes the CUDA runtime: uses an NVIDIA GPU when the NVIDIA driver is installed, otherwise Vulkan, otherwise the CPU.

            ### Command-line tool
            - Windows: `purr-cli-windows-x64-cuda-vulkan.zip`. Extract all files to one folder. Uses an NVIDIA GPU (CUDA) when available, otherwise Vulkan, otherwise the CPU.
            - macOS (Apple Silicon): `purr-cli-macos-arm64-metal.tar.gz`
            - Linux: `purr-cli-linux-x64-all.tar.gz` (recommended). Keep the `lib` folder next to `purr`. Uses an NVIDIA GPU (CUDA) when the NVIDIA driver is installed, otherwise Vulkan, otherwise the CPU.
              - `purr-cli-linux-x64-vulkan.tar.gz`: smaller, for AMD and Intel GPUs. Uses Vulkan when a Vulkan driver is installed, otherwise the CPU.
              - `purr-cli-linux-x64-cpu.tar.gz`: smallest, CPU only.
              - `purr-cli-linux-x64-cuda.tar.gz`: NVIDIA only. Keep the `lib` folder next to `purr`. Does not start without the NVIDIA driver.
              - All Linux builds need an x86-64 CPU with AVX2 (2013 or later).

            ### Web
            `purr-web.tar.gz` for web deployment.

            ### Checksums
            Verify your download with `SHA256SUMS.txt`
          prerelease: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old nightly releases
        run: |
          # Keep only the last 7 nightly releases
          NIGHTLY_TAGS=$(git tag -l 'nightly-*' --sort=-version:refname | tail -n +8)
          if [ ! -z "$NIGHTLY_TAGS" ]; then
            for tag in $NIGHTLY_TAGS; do
              echo "Deleting old nightly release: $tag"
              gh release delete "$tag" --yes || true
              git push --delete origin "$tag" || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tagged-release:
    name: Create Tagged Release
    runs-on: ubuntu-latest
    # Only run on version tags (e.g., v1.0.0, v2.1.3-beta)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Check if this is a prerelease
          if [[ "$VERSION" == *"-"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "feat", "enhancement"]
                },
                {
                  "title": "## 🐛 Bug Fixes",
                  "labels": ["fix", "bugfix", "bug"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test", "testing"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["docs", "documentation"]
                },
                {
                  "title": "## 🏗️ Refactoring",
                  "labels": ["refactor", "refactoring"]
                },
                {
                  "title": "## 🎨 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🔧 Maintenance",
                  "labels": ["chore", "ci", "build", "deps"]
                },
                {
                  "title": "## ⚠️ Breaking Changes",
                  "labels": ["breaking", "breaking-change"]
                }
              ],
              "template": "# Release ${{ steps.version.outputs.version }}\n\n#{{CHANGELOG}}\n\n## 📦 Build Information\n- Linux x64: CUDA + Vulkan backends in one build (falls back to CPU without a GPU runtime), plus CPU-only, Vulkan-only and CUDA-only builds\n- macOS Apple Silicon: Metal backend\n- Windows x64: CUDA + Vulkan backends (falls back to CPU without a GPU runtime)\n- Each platform ships the command-line tool and the desktop app separately",
              "pr_template": "- #{{TITLE}} (#{{NUMBER}}) @#{{AUTHOR}}"
            }
          toTag: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CLI Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: purr-cli-*
          path: ./release-artifacts

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: purr-desktop-*
          path: ./release-artifacts

      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./release-artifacts/purr-web

      - name: Package Release Assets
        run: bash scripts/package-release-assets.sh "${{ steps.version.outputs.version }}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Purr ${{ steps.version.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📥 Downloads

            Replace `VERSION` with `${{ steps.version.outputs.version }}` in the file names below.

            ### Desktop app
            - Windows: `purr-VERSION-desktop-windows-x64-cuda-vulkan-setup.exe` (installer, Vulkan and CPU) or `purr-VERSION-desktop-windows-x64-cuda-vulkan-portable.zip` (includes the CUDA runtime DLLs)
            - macOS (Apple Silicon): `purr-VERSION-desktop-macos-arm64-metal.dmg`
            - Linux: `purr-VERSION-desktop-linux-x64-all.deb` (an `.AppImage` is attached when it could be built). Includes the CUDA runtime: uses an NVIDIA GPU when the NVIDIA driver is installed, otherwise Vulkan, otherwise the CPU.

            ### Command-line tool
            - Windows: `purr-VERSION-cli-windows-x64-cuda-vulkan.zip`. Extract all files to one folder.
            - macOS (Apple Silicon): `purr-VERSION-cli-macos-arm64-metal.tar.gz`
            - Linux: `purr-VERSION-cli-linux-x64-all.tar.gz` (recommended). Keep the `lib` folder next to `purr`. Uses CUDA, otherwise Vulkan, otherwise the CPU.
              - `purr-VERSION-cli-linux-x64-vulkan.tar.gz`: smaller, Vulkan otherwise the CPU.
              - `purr-VERSION-cli-linux-x64-cpu.tar.gz`: smallest, CPU only.
              - `purr-VERSION-cli-linux-x64-cuda.tar.gz`: NVIDIA only; does not start without the NVIDIA driver.
              - All Linux builds need an x86-64 CPU with AVX2 (2013 or later).

            ### Web
            `purr-VERSION-web.tar.gz` for deployment.

            ## 🔒 Verification
            Verify downloads using the provided `SHA256SUMS.txt`
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
