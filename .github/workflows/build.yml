# https://github.com/zmwangx/rust-ffmpeg/blob/master/.github/workflows/build.yml

name: build
on:
  push:
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Create nightly release"
        required: false
        default: false
        type: boolean

env:
  DIOXUS_VERSION: 0.8.0-alpha.3
  VCPKG_COMMIT: efecf268f3a3ec78f4bf1f0c36759bdb23c6f653
  VCPKG_FFMPEG: ffmpeg[core,avcodec,avformat,swresample]
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build-linux:
    name: Build Linux${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ["none", cuda, vulkan]
        include:
          - backend: cuda
            is_release: true # Mark CUDA as the release variant for Linux
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends clang curl pkg-config gcc ca-certificates openssl libssl-dev cmake libc6-dev make wget fuse libfuse2 \
            nasm autoconf automake libtool \
            llvm \
            libgtk-3-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-ffmpeg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}
      - name: Install FFmpeg (static)
        run: |
          VCPKG_DIR="$RUNNER_TEMP/vcpkg"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg "$VCPKG_DIR"
          git -C "$VCPKG_DIR" checkout --quiet "$VCPKG_COMMIT"
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_DIR/vcpkg" install "$VCPKG_FFMPEG:x64-linux"
          echo "PKG_CONFIG_PATH=$VCPKG_DIR/installed/x64-linux/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install cuda
        if: matrix.backend == 'cuda'
        run: |
          CUDA_REPO="ubuntu$(lsb_release -rs | tr -d '.')"
          CUDA_VERSION="13-5"
          CUDA_PATH_VERSION="13.5"

          wget https://developer.download.nvidia.com/compute/cuda/repos/${CUDA_REPO}/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt update
          sudo apt install -y cuda-toolkit-${CUDA_VERSION}
          CUDA_PATH=/usr/local/cuda-${CUDA_PATH_VERSION}/
          echo "CUDA_PATH=$CUDA_PATH" >> $GITHUB_ENV
          echo "$CUDA_PATH/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$CUDA_PATH/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV
      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        run: |
          # Install Vulkan SDK using system packages for Ubuntu 24.04
          sudo apt update
          sudo apt install -y libvulkan-dev vulkan-tools vulkan-utility-libraries-dev spirv-tools
          # Download and install latest Vulkan SDK manually
          VULKAN_SDK_VERSION="1.4.363.1"
          wget https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz
          tar -xf vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz
          export VULKAN_SDK="$(pwd)/${VULKAN_SDK_VERSION}/x86_64"
          echo "VULKAN_SDK=$VULKAN_SDK" >> $GITHUB_ENV
          echo "$VULKAN_SDK/bin" >> $GITHUB_PATH
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache Dioxus CLI
        id: cache-dx-linux
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: dioxus-cli-${{ runner.os }}-${{ env.DIOXUS_VERSION }}
      - name: Install Dioxus CLI
        if: steps.cache-dx-linux.outputs.cache-hit != 'true'
        run: |
          cargo install dioxus-cli --version ${{ env.DIOXUS_VERSION }} --locked
      - name: Build Binary${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
        run: |
          RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN/lib --cfg=web_sys_unstable_apis' cargo build -p purr-cli --release --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      # - name: Build Dioxus Desktop${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
      #   run: |
      #     dx bundle -p purr-app --release --linux \
      #       --out-dir dist-linux \
      #       ${{ matrix.backend != 'none' && format(' --features {0}', matrix.backend) || '' }}
      - name: Build Dioxus web
        if: matrix.backend == 'none'
        run: |
          dx bundle --verbose -p purr-app --release --web --out-dir dist-web
      - name: Prepare Linux Artifacts
        if: matrix.is_release == true
        run: |
          mkdir -p artifacts/linux
          cp target/release/purr artifacts/linux/purr
          if [ "${{ matrix.backend }}" = "cuda" ]; then
            mkdir -p artifacts/linux/lib
            ldd target/release/purr | awk '/lib(cudart|cublas|cublasLt)\.so/ { print $3 }' | xargs -r -I{} cp -L {} artifacts/linux/lib/
          fi
          if [ -f target/release/purr-app ]; then
            cp target/release/purr-app artifacts/linux/
          fi
          # Add version info
          echo "$(git describe --tags --always --dirty)" > artifacts/linux/VERSION
      - name: Archive Linux Release Artifacts
        if: matrix.is_release == true
        uses: actions/upload-artifact@v7
        with:
          name: purr-linux-x64-cuda
          path: artifacts/linux/
          retention-days: 30
      - name: Archive Linux Build Artifacts (Dev)
        if: matrix.is_release != true
        uses: actions/upload-artifact@v7
        with:
          name: purr-linux-dev${{ matrix.backend != 'none' && format('-{0}', matrix.backend) || '' }}
          path: |
            target/release/purr*
            dist-linux/
          retention-days: 7
      - name: Archive web artifacts
        if: matrix.backend == 'none'
        uses: actions/upload-artifact@v7
        with:
          name: purr-web
          path: dist-web/

  build-macos:
    name: Build macOS ${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ["none", "metal", "coreml", "metal,coreml"]
        include:
          - backend: "metal,coreml"
            is_release: true # Mark metal+coreml as the release variant for macOS
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          brew uninstall cmake || true
          brew install cmake nasm autoconf automake libtool pkg-config
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-ffmpeg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}
      - name: Install FFmpeg (static)
        run: |
          VCPKG_DIR="$RUNNER_TEMP/vcpkg"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg "$VCPKG_DIR"
          git -C "$VCPKG_DIR" checkout --quiet "$VCPKG_COMMIT"
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_DIR/vcpkg" install "$VCPKG_FFMPEG:arm64-osx"
          echo "PKG_CONFIG_PATH=$VCPKG_DIR/installed/arm64-osx/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache Dioxus CLI
        id: cache-dx-macos
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: dioxus-cli-${{ runner.os }}-${{ env.DIOXUS_VERSION }}
      - name: Install Dioxus CLI
        if: steps.cache-dx-macos.outputs.cache-hit != 'true'
        run: |
          cargo install dioxus-cli --version ${{ env.DIOXUS_VERSION }} --locked
      - name: Build
        run: |
          export CFLAGS="-march=armv8.2-a+noi8mm"
          export CXXFLAGS="-march=armv8.2-a+noi8mm"
          cargo build -p purr-cli --release --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Build Dioxus Desktop
        run: |
          export CFLAGS="-march=armv8.2-a+noi8mm"
          export CXXFLAGS="-march=armv8.2-a+noi8mm"
          dx bundle -p purr-app --release --macos \
            --out-dir dist-macos \
            --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Prepare macOS Artifacts
        if: matrix.is_release == true
        run: |
          mkdir -p artifacts/macos
          cp target/release/purr artifacts/macos/purr
          # If .app bundle exists, include it
          if [ -d "dist-macos/Purr.app" ]; then
            cp -r dist-macos/Purr.app artifacts/macos/
            # Create a DMG for easier distribution
            hdiutil create -volname "Purr" -srcfolder artifacts/macos/Purr.app -ov -format UDZO artifacts/macos/Purr.dmg || true
          fi
          # Add version info
          echo "$(git describe --tags --always --dirty)" > artifacts/macos/VERSION
      - name: Archive macOS Release Artifacts
        if: matrix.is_release == true
        uses: actions/upload-artifact@v7
        with:
          name: purr-macos-universal-metal-coreml
          path: artifacts/macos/
          retention-days: 30
      - name: Archive macOS Build Artifacts (Dev)
        if: matrix.is_release != true
        uses: actions/upload-artifact@v7
        with:
          name: purr-macos-dev${{ matrix.backend != 'none' && format('-{0}', matrix.backend) || '' }}
          path: |
            target/release/purr*
            dist-macos/
          retention-days: 7

  build-windows:
    defaults:
      run:
        shell: pwsh
    name: Build Windows${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: ["none", cuda, vulkan, "cuda,vulkan"]
        include:
          - backend: cuda
            is_release: true # Mark CUDA as the release variant for Windows (Vulkan fails to bundle)
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          $VCINSTALLDIR = $(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath)
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=${VCINSTALLDIR}\VC\Tools\LLVM\x64\bin`n"
          choco install -y cmake
          choco install -y visualstudio2022buildtools
          choco install -y visualstudio2022-workload-vctools
          choco install -y llvm
          choco install -y windows-sdk-10.0
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-ffmpeg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}
      - name: Install FFmpeg (static)
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP vcpkg
          git clone --quiet --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg $vcpkg
          git -C $vcpkg checkout --quiet $env:VCPKG_COMMIT
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkg\vcpkg.exe" install "$($env:VCPKG_FFMPEG):x64-windows-static-md"
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$vcpkg"
          Add-Content $env:GITHUB_ENV "VCPKGRS_TRIPLET=x64-windows-static-md"
      - name: Install cuda
        if: contains(matrix.backend, 'cuda')
        run: |
          choco install -r cuda --version 13.5.0
          $CUDA_PATH = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.5\"
          # check if CUDA_PATH exists
          if (-Not (Test-Path $CUDA_PATH)) {
              Write-Error "CUDA_PATH does not exist: $CUDA_PATH"
              exit 1
          }
          Add-Content $env:GITHUB_ENV "CUDA_PATH=${CUDA_PATH}"
          Add-Content $env:GITHUB_ENV "CUDA_PATH_V13_5=${CUDA_PATH}"
          Add-Content $env:GITHUB_ENV "CUDA_BIN_PATH=${CUDA_PATH}\bin"
          Add-Content $env:GITHUB_ENV "CUDA_LIB_PATH=${CUDA_PATH}\lib\x64"
          Add-Content $env:GITHUB_PATH "${CUDA_PATH}\bin\x64"
          Add-Content $env:GITHUB_PATH "${CUDA_PATH}\bin"
      - name: Install Vulkan SDK
        if: contains(matrix.backend, 'vulkan')
        run: |
          $VulkanSDKVersion = "1.4.363.1"
          $VulkanSDKUrl = "https://sdk.lunarg.com/sdk/download/${VulkanSDKVersion}/windows/vulkansdk-windows-X64-${VulkanSDKVersion}.exe"
          Invoke-WebRequest -Uri ${VulkanSDKUrl} -OutFile VulkanSDK-Installer.exe
          Start-Process -Wait -FilePath .\VulkanSDK-Installer.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install --root C:\VulkanSDK\${VulkanSDKVersion} --no-shortcuts --no-start-menu --no-desktop-icon --no-update-check"
          $VULKAN_SDK = "C:\VulkanSDK\${VulkanSDKVersion}"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=${VULKAN_SDK}"
          Add-Content $env:GITHUB_PATH "${VULKAN_SDK}\Bin"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Cache Dioxus CLI
        id: cache-dx-windows
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx.exe
          key: dioxus-cli-${{ runner.os }}-${{ env.DIOXUS_VERSION }}
      - name: Install Dioxus CLI
        if: steps.cache-dx-windows.outputs.cache-hit != 'true'
        run: |
          cargo install dioxus-cli --version ${{ env.DIOXUS_VERSION }} --locked
      - name: Install Visual Studio Build Tools
        uses: microsoft/setup-msbuild@v3
      - name: Build binary${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
        run: |
          cargo build -p purr-cli --release --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Build Dioxus Desktop${{ matrix.backend != 'none' && format(' - {0}', matrix.backend) || '' }}
        env:
          CARGO_TARGET_DIR: D:\t\
        run: |
          dx bundle --verbose --trace -p purr-app --release --profile r --windows --out-dir dist-windows --features static-ffmpeg${{ matrix.backend != 'none' && format(',{0}', matrix.backend) || '' }}
      - name: Prepare Windows Artifacts
        if: matrix.is_release == true
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows

          # Copy main executable
          Copy-Item target\release\purr.exe artifacts\windows\purr.exe

          # Copy any DLLs from target/release
          Get-ChildItem target\release\*.dll | Copy-Item -Destination artifacts\windows\

          # Copy CUDA runtime libraries if CUDA build
          if ("${{ matrix.backend }}" -match "cuda") {
            # Copy essential CUDA runtime DLLs
            $cudaBinPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.5\bin\x64"
            foreach ($pattern in "cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll") {
              $found = Get-ChildItem "$cudaBinPath\$pattern"
              if (-Not $found) {
                Write-Error "CUDA runtime DLL not found: $cudaBinPath\$pattern"
                exit 1
              }
              $found | Copy-Item -Destination artifacts\windows\
            }
          }

          # If MSI installer exists, include it
          if (Test-Path "dist-windows\*.msi") {
            Copy-Item dist-windows\*.msi artifacts\windows\
          }

          # Add version info
          git describe --tags --always --dirty | Out-File -FilePath artifacts\windows\VERSION.txt -Encoding utf8
      - name: Archive Windows Release Artifacts
        if: matrix.is_release == true
        uses: actions/upload-artifact@v7
        with:
          name: purr-windows-x64-cuda
          path: artifacts/windows/
          retention-days: 30
      - name: Archive Windows Build Artifacts (Dev)
        if: matrix.is_release != true
        uses: actions/upload-artifact@v7
        with:
          name: purr-windows-dev${{ matrix.backend != 'none' && format('-{0}', matrix.backend) || '' }}
          path: |
            target/release/purr*
            dist-windows/
          retention-days: 7

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v7
      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./dist-web
      - name: Setup Vercel Output Directory
        run: |
          mkdir -p .vercel/output/static
          cp -r ./dist-web/public/* .vercel/output/static/
          cp res/vercel-config.json .vercel/output/config.json
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Setup Environment
        id: setup-env
        run: |
          # set the environment to preview by default, and production if needed
          ENVIRONMENT="preview"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          vercel pull --yes --environment=$ENVIRONMENT --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: |
          vercel --yes ${{ steps.setup-env.outputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --prebuilt

  nightly-release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    # Only run for scheduled nightly builds or manual trigger with nightly input
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly == true)
    needs: [build-linux, build-macos, build-windows]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for tags

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Get previous nightly tag
        id: prev_tag
        run: |
          # Find the most recent nightly tag
          PREV_TAG=$(git tag -l 'nightly-*' --sort=-version:refname | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            # If no nightly tag exists, use the most recent tag
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "feat", "enhancement"]
                },
                {
                  "title": "## 🐛 Bug Fixes",
                  "labels": ["fix", "bugfix", "bug"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test", "testing"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["docs", "documentation"]
                },
                {
                  "title": "## 🏗️ Refactoring",
                  "labels": ["refactor", "refactoring"]
                },
                {
                  "title": "## 🎨 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🔧 Maintenance",
                  "labels": ["chore", "ci", "build", "deps"]
                }
              ],
              "template": "# Nightly Build - ${{ steps.date.outputs.date }}\n\n#{{CHANGELOG}}\n\n## 📊 Uncategorized Changes\n#{{UNCATEGORIZED}}\n\n---\n*This is an automated nightly build. It may be unstable.*\n\n## 📦 Build Information\n- Linux: CUDA backend\n- macOS: Metal + CoreML backend\n- Windows: CUDA backend",
              "pr_template": "- #{{TITLE}} (#{{NUMBER}}) @#{{AUTHOR}}"
            }
          fromTag: ${{ steps.prev_tag.outputs.tag }}
          toTag: HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-linux-x64-cuda
          path: ./release-artifacts/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-macos-universal-metal-coreml
          path: ./release-artifacts/macos

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-windows-x64-cuda
          path: ./release-artifacts/windows

      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./release-artifacts/web

      - name: Package Release Assets
        run: |
          # Create organized release structure
          mkdir -p release-assets

          # Package Linux binary
          cd release-artifacts/linux
          chmod +x purr
          tar czf ../../release-assets/purr-linux-x64-cuda.tar.gz *
          cd ../..

          # Package macOS
          cd release-artifacts/macos
          if [ -f "Purr.dmg" ]; then
            # If DMG exists, use it directly
            cp Purr.dmg ../../release-assets/purr-macos-universal.dmg
          else
            # Otherwise package the binary
            chmod +x purr
            tar czf ../../release-assets/purr-macos-universal.tar.gz purr VERSION
          fi
          cd ../..

          # Package Windows (create ZIP for Windows users)
          cd release-artifacts/windows
          # Use zip for Windows artifacts
          zip -r ../../release-assets/purr-windows-x64-cuda.zip *
          cd ../..

          # Package Web
          cd release-artifacts/web
          tar czf ../../release-assets/purr-web.tar.gz *
          cd ../..

          # Generate checksums
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}
          name: Nightly Build - ${{ steps.date.outputs.date }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📥 Download Instructions

            ### Windows
            Download `purr-windows-x64-cuda.zip` and extract all files to a folder. Requires NVIDIA GPU with CUDA support.

            ### Linux
            Download `purr-linux-x64-cuda.tar.gz` and extract:
            ```bash
            tar xzf purr-linux-x64-cuda.tar.gz
            chmod +x purr
            ./purr
            ```
            Keep the `lib` folder next to `purr`. Requires an NVIDIA GPU with CUDA support and the NVIDIA driver.

            ### macOS
            Download `purr-macos-universal.dmg` (or `.tar.gz` if DMG unavailable)
            Optimized for Apple Silicon with Metal and CoreML support.

            ### Web
            Download `purr-web.tar.gz` for web deployment.

            ### Checksums
            Verify your download with `SHA256SUMS.txt`
          prerelease: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old nightly releases
        run: |
          # Keep only the last 7 nightly releases
          NIGHTLY_TAGS=$(git tag -l 'nightly-*' --sort=-version:refname | tail -n +8)
          if [ ! -z "$NIGHTLY_TAGS" ]; then
            for tag in $NIGHTLY_TAGS; do
              echo "Deleting old nightly release: $tag"
              gh release delete "$tag" --yes || true
              git push --delete origin "$tag" || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tagged-release:
    name: Create Tagged Release
    runs-on: ubuntu-latest
    # Only run on version tags (e.g., v1.0.0, v2.1.3-beta)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Check if this is a prerelease
          if [[ "$VERSION" == *"-"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature", "feat", "enhancement"]
                },
                {
                  "title": "## 🐛 Bug Fixes",
                  "labels": ["fix", "bugfix", "bug"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test", "testing"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["docs", "documentation"]
                },
                {
                  "title": "## 🏗️ Refactoring",
                  "labels": ["refactor", "refactoring"]
                },
                {
                  "title": "## 🎨 Style",
                  "labels": ["style"]
                },
                {
                  "title": "## 🔧 Maintenance",
                  "labels": ["chore", "ci", "build", "deps"]
                },
                {
                  "title": "## ⚠️ Breaking Changes",
                  "labels": ["breaking", "breaking-change"]
                }
              ],
              "template": "# Release ${{ steps.version.outputs.version }}\n\n#{{CHANGELOG}}\n\n## 📦 Build Information\n- Linux: CUDA backend\n- macOS: Metal + CoreML backend\n- Windows: CUDA backend",
              "pr_template": "- #{{TITLE}} (#{{NUMBER}}) @#{{AUTHOR}}"
            }
          toTag: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-linux-x64-cuda
          path: ./release-artifacts/linux

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-macos-universal-metal-coreml
          path: ./release-artifacts/macos

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-windows-x64-cuda
          path: ./release-artifacts/windows

      - name: Download Web Artifacts
        uses: actions/download-artifact@v8
        with:
          name: purr-web
          path: ./release-artifacts/web

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          VERSION=${{ steps.version.outputs.version }}

          # Package Linux binary
          cd release-artifacts/linux
          chmod +x purr
          tar czf ../../release-assets/purr-${VERSION}-linux-x64-cuda.tar.gz purr VERSION
          cd ../..

          # Package macOS
          cd release-artifacts/macos
          if [ -f "Purr.dmg" ]; then
            cp Purr.dmg ../../release-assets/purr-${VERSION}-macos-universal.dmg
          else
            chmod +x purr
            tar czf ../../release-assets/purr-${VERSION}-macos-universal.tar.gz purr VERSION
          fi
          cd ../..

          # Package Windows
          cd release-artifacts/windows
          zip -r ../../release-assets/purr-${VERSION}-windows-x64-cuda.zip *
          cd ../..

          # Package Web
          cd release-artifacts/web
          tar czf ../../release-assets/purr-${VERSION}-web.tar.gz *
          cd ../..

          # Generate checksums
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Purr ${{ steps.version.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## 📥 Installation

            ### Windows
            Download `purr-${{ steps.version.outputs.version }}-windows-x64-cuda.zip`
            Extract all files and run `purr.exe`

            Requirements: Windows 10/11 with NVIDIA GPU and CUDA support

            ### Linux
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/purr-${{ steps.version.outputs.version }}-linux-x64-cuda.tar.gz
            tar xzf purr-${{ steps.version.outputs.version }}-linux-x64-cuda.tar.gz
            chmod +x purr
            ./purr
            ```
            Requirements: Linux with NVIDIA GPU and CUDA support

            ### macOS
            Download `purr-${{ steps.version.outputs.version }}-macos-universal.dmg`
            Mount the DMG and drag Purr to Applications

            Requirements: macOS 11+ (optimized for Apple Silicon)

            ### Web
            Download `purr-${{ steps.version.outputs.version }}-web.tar.gz` for deployment

            ## 🔒 Verification
            Verify downloads using the provided `SHA256SUMS.txt`
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
