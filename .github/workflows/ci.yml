name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-prune-rust-caches.sh
      - run: bash scripts/test-drop-ggml-build.sh

  test:
    name: test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config cmake libssl-dev \
            libgtk-3-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-linux
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features purr-core/static-ffmpeg
      - name: Tests
        run: cargo nextest run --workspace --features purr-core/static-ffmpeg
      - name: The transcribe.cpp engine lists its devices in the CLI
        run: |
          cargo build -p purr-cli --features static-ffmpeg,transcribe
          lib_dir="$(dirname "$(find target/debug/build -name 'libtranscribe.so*' -print -quit)")"
          LD_LIBRARY_PATH="$lib_dir" target/debug/purr sys --json \
            | jq -e '.engines[] | select(.engine == "transcribe-cpp") | .status.ready.devices | length > 0'
