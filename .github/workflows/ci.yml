name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-prune-rust-caches.sh
      - run: bash scripts/test-drop-ggml-build.sh

  test:
    name: test (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config cmake libssl-dev \
            libgtk-3-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libxdo-dev
      - uses: ./.github/actions/setup-ffmpeg
        with:
          triplet: x64-linux
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features purr-core/static-ffmpeg
      - name: Tests
        run: cargo nextest run --workspace --features purr-core/static-ffmpeg
      - name: The transcribe.cpp engine lists its devices in the CLI
        run: |
          cargo build -p purr-cli --features static-ffmpeg,transcribe --message-format=json-render-diagnostics > "$RUNNER_TEMP/cargo-messages.jsonl"
          lib_dir="$(jq -rs '[.[] | select(.reason == "build-script-executed" and (.package_id | contains("transcribe-cpp-sys"))) | .out_dir] | unique | if length == 1 then .[0] else error("expected one transcribe-cpp-sys build script output") end' "$RUNNER_TEMP/cargo-messages.jsonl")/lib"
          echo "TRANSCRIBE_LIB_DIR=$lib_dir" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$lib_dir" target/debug/purr sys --json \
            | jq -e '.engines[] | select(.engine == "transcribe-cpp") | .status.ready.devices | length > 0'
          LD_LIBRARY_PATH="$lib_dir" target/debug/purr sys --json \
            | jq -e '[.hardware[] | select(.seen_by | map(.engine) | index("whisper-cpp") and index("transcribe-cpp"))] | length > 0'
      - name: The two engines keep their own ggml
        run: |
          if nm -D target/debug/purr | grep -E ' (ggml|gguf)_'; then
            echo "::error::purr exports or imports ggml symbols, so libtranscribe can bind to the ggml inside the executable"
            exit 1
          fi
          LD_LIBRARY_PATH="$TRANSCRIBE_LIB_DIR" LD_DEBUG=bindings LD_DEBUG_OUTPUT=bindings target/debug/purr sys --json > /dev/null
          test -n "$(cat bindings.*)" || { echo "::error::LD_DEBUG wrote no bindings"; exit 1; }
          if cat bindings.* | grep -E 'binding file [^ ]*lib(transcribe|ggml)[^ ]* \[0\] to [^ ]*/purr \[0\]'; then
            echo "::error::a transcribe.cpp library bound a symbol to the executable"
            exit 1
          fi
