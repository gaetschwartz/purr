name: Set up the compiler cache
description: >
  Install a pinned ccache, make cmake use it for C, C++ and CUDA, and restore the rolling cache
  entry of the runner OS. Does nothing unless enabled is "on", and the job carries on without the
  cache when ccache cannot be set up. A job that calls this ends with finish-compiler-cache.
inputs:
  enabled:
    description: 'on: set the cache up. Anything else: do nothing. Pass the PURR_COMPILER_CACHE workflow variable.'
    required: true
  base-dir:
    description: Directory that holds every cmake build tree and source copy of ggml. ccache rewrites the absolute paths under it to relative ones, which keeps the keys independent of cargo's output directory hashes. It must not contain the toolchains or SDKs.
    required: true
  max-size:
    description: Size cap of the ccache directory, in ccache units
    required: false
    default: 2G
  compiler-check:
    description: ccache compiler_check. `content` hashes the compiler binaries. `%compiler% --version` is for compilers that are shims whose binary does not change with the toolchain.
    required: false
    default: content
runs:
  using: composite
  steps:
    - name: Install ccache
      id: install
      if: inputs.enabled == 'on'
      continue-on-error: true
      shell: bash
      env:
        BASE_DIR: ${{ inputs.base-dir }}
        MAX_SIZE: ${{ inputs.max-size }}
        COMPILER_CHECK: ${{ inputs.compiler-check }}
      run: |
        set -euo pipefail
        trap 'echo "::warning title=Compiler cache::ccache could not be set up, so this job compiles without it"' ERR

        version=4.14.2
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            asset="ccache-$version-linux-x86_64-musl-static.tar.gz"
            sha256=d540ba01f160addbd3dd5e18eda9bd34005591b095c09ac8ae9d0a1b655e7ef5
            binary=ccache ;;
          macOS-ARM64)
            asset="ccache-$version-darwin.tar.gz"
            sha256=cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc
            binary=ccache ;;
          Windows-X64)
            asset="ccache-$version-windows-x86_64.zip"
            sha256=6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84
            binary=ccache.exe ;;
          *)
            echo "no ccache build is pinned for $RUNNER_OS-$RUNNER_ARCH"
            false ;;
        esac

        native() { if command -v cygpath > /dev/null; then cygpath -w "$1"; else echo "$1"; fi; }
        mixed() { if command -v cygpath > /dev/null; then cygpath -m "$1"; else echo "$1"; fi; }

        work="$RUNNER_TEMP/ccache-install"
        bindir="$RUNNER_TEMP/ccache-bin"
        rm -rf "$work" "$bindir"
        mkdir -p "$work/extract" "$bindir"

        curl -fsSL --retry 3 --retry-delay 5 -o "$work/$asset" "https://github.com/ccache/ccache/releases/download/v$version/$asset"
        if command -v sha256sum > /dev/null; then
          (cd "$work" && echo "$sha256  $asset" | sha256sum -c -)
        else
          (cd "$work" && echo "$sha256  $asset" | shasum -a 256 -c -)
        fi
        case "$asset" in
          *.zip) pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$(native "$work/$asset")' -DestinationPath '$(native "$work/extract")'" ;;
          *) tar -xzf "$work/$asset" -C "$work/extract" ;;
        esac
        found="$(find "$work/extract" -type f -name "$binary" | head -n 1)"
        [ -n "$found" ]
        cp "$found" "$bindir/$binary"
        chmod +x "$bindir/$binary"
        reported="$("$bindir/$binary" --version | head -n 1 | tr -d '\r')"
        echo "$reported"
        [ "$reported" = "ccache version $version" ]
        rm -rf "$work"

        cache_dir="$(mixed "$RUNNER_TEMP")/ccache"
        mkdir -p "$cache_dir"
        prefix="ccache-$RUNNER_OS-v1-"
        base_dir="$(mixed "$BASE_DIR")"
        native "$bindir" >> "$GITHUB_PATH"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "ok=true" >> "$GITHUB_OUTPUT"
        {
          echo "PURR_COMPILER_CACHE_ACTIVE=true"
          echo "PURR_COMPILER_CACHE_PREFIX=$prefix"
          echo "CCACHE_DIR=$cache_dir"
          echo "CCACHE_BASEDIR=$base_dir"
          echo "CCACHE_NOHASHDIR=1"
          echo "CCACHE_MAXSIZE=$MAX_SIZE"
          echo "CCACHE_COMPILERCHECK=$COMPILER_CHECK"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CUDA_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"

    - name: Restore the compiler cache
      id: restore
      if: steps.install.outputs.ok == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ steps.install.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.install.outputs.prefix }}

    - name: Show the compiler cache configuration
      if: steps.install.outputs.ok == 'true'
      shell: bash
      env:
        RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        set -euo pipefail
        echo "PURR_COMPILER_CACHE_RESTORED=${RESTORED_KEY:-none}" >> "$GITHUB_ENV"
        ccache --zero-stats
        ccache --show-config | grep -E '^\(environment\) (base_dir|hash_dir|max_size|compiler_check|cache_dir) ' || true
        ccache --show-stats
        echo "restored: ${RESTORED_KEY:-nothing, a cold compiler cache}"
