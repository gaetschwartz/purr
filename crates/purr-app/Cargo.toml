[package]
name = "purr-app"
version.workspace = true
authors = ["Gaëtan Schwartz"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "purr_app"
path = "src/lib.rs"

[[bin]]
name = "purr-app"
path = "src/main.rs"


[dependencies]
# Desktop-only dependencies
purr-core = { path = "../purr-core", optional = true }
purr-engine-whisper = { path = "../purr-engine-whisper", optional = true }
purr-common = { path = "../purr-common" }
tokio = { version = "1.47.1", default-features = false }
tracing-subscriber = { version = "0.3" }

# Shared dependencies (work on both WASM and native)
dioxus = { version = "0.8.0-alpha.3", features = ["router"] }
futures = { version = "0.3.31", default-features = false, features = [
  "async-await",
  "alloc",
  "std",
] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
bytes = "1.10.1"
uuid = { version = "1.5.0", features = ["v4", "js", "v3"] }
tracing = "0.1.41"
oopsie = { workspace = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

# Web-only dependencies (only for WASM builds)
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "FormData", "Blob", "BlobPropertyBag", "console", "Url"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", features = [
  "serde-serialize",
], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

# Desktop-only dependencies
rfd = { version = "0.18.0", features = [
  "xdg-portal",
], default-features = false, optional = true }
cached = { version = "4.1.1", optional = true }
directories = { version = "6.0", optional = true }
toml = { version = "1.2", optional = true }
purr-wasm = { path = "../purr-wasm", optional = true }
scc = { version = "3.1.2", features = ["serde"] }
serde_with = "3.14.1"
strum = { version = "0.28.0", features = ["derive"] }
ambassador = "0.5.1"
parking_lot = { version = "0.13.0", optional = true }
purr-engine-transcribe = { version = "0.1.0", path = "../purr-engine-transcribe", optional = true }
memory-stats = { version = "1.2.0", optional = true }

[features]
default = ["desktop"]

# Web feature includes only WASM-compatible dependencies
web = [
  "dioxus/web",
  "gloo-timers",
  "web-sys",
  "js-sys",
  "wasm-bindgen",
  "wasm-bindgen-futures",
  "getrandom",
  "serde_json",
  "purr-wasm",
]

# Desktop feature includes desktop-specific functionality and transcription
desktop = [
  "dioxus/desktop",
  "tokio/full",
  "purr-core",
  "purr-engine-whisper",
  "rfd",
  "cached",
  "serde_json",
  "chrono",
  "directories",
  "toml",
  "parking_lot",
  "memory-stats",
]

# Mobile feature
mobile = ["dioxus/mobile"]

vulkan = ["purr-engine-whisper/vulkan", "purr-engine-transcribe?/vulkan"]
cuda = ["purr-engine-whisper/cuda", "purr-engine-transcribe?/cuda"]
metal = ["purr-engine-whisper/metal", "purr-engine-transcribe?/metal"]
coreml = ["purr-engine-whisper/coreml"]
static-ffmpeg = ["purr-core/static-ffmpeg"]
gloo-timers = ["dep:gloo-timers"]
parking_lot = ["dep:parking_lot"]
web-sys = ["dep:web-sys"]
transcribe = ["dep:purr-engine-transcribe"]
memory-stats = ["dep:memory-stats"]

[dev-dependencies]
rstest = "0.28"
pretty_assertions = "1.4.1"
tempfile = "3.21"
wasm-bindgen-test = "0.3"

[lints]
workspace = true

[build-dependencies]
purr-delayload = { path = "../purr-delayload" }
