[package]
name = "purr-app"
version = "0.1.0"
authors = ["Gaëtan Schwartz"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "purr_app"
path = "src/lib.rs"

[[bin]]
name = "purr-app"
path = "src/main.rs"


[dependencies]
# Desktop-only dependencies
purr-core = { path = "../purr-core", optional = true }
purr-common = { path = "../purr-common" }
tokio = { version = "1.47.1", default-features = false }
tracing-subscriber = { version = "0.3" }

# Shared dependencies (work on both WASM and native)
dioxus = { version = "0.8.0-alpha.3", features = ["router"] }
futures = { version = "0.3.31", default-features = false, features = [
  "async-await",
  "alloc",
  "std",
] }
async-trait = "0.1"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
bytes = "1.10.1"
uuid = { version = "1.5.0", features = ["v4", "js", "v3"] }
tracing = "0.1.41"
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.9"
chrono = { version = "0.4", features = ["serde"], optional = true }

# Web-only dependencies (only for WASM builds)
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
gloo-file = { version = "0.4.0", optional = true }
web-sys = { version = "0.3", features = [
  "Window",
  "Request",
  "RequestInit",
  "Response",
  "FormData",
  "Blob",
  "BlobPropertyBag",
  "console",
  "MediaQueryList",
], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", features = [
  "serde-serialize",
], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

# Desktop-only dependencies
rfd = { version = "0.18.0", features = [
  "xdg-portal",
], default-features = false, optional = true }
cached = { version = "4.1.1", optional = true }
directories = { version = "6.0", optional = true }
toml = { version = "1.2", optional = true }
toml_edit = { version = "0.25", optional = true }
const-str = { version = "1.1.0", features = ["all"] }
purr-wasm = { path = "../purr-wasm", optional = true }
scc = { version = "3.1.2", features = ["serde"] }
serde_with = "3.14.1"
strum = { version = "0.28.0", features = ["derive"] }
ambassador = "0.5.1"

# Theme system dependencies
indexmap = "2.0"

[features]
default = ["desktop"]

# Web feature includes only WASM-compatible dependencies
web = [
  "dioxus/web",
  "gloo-timers",
  "gloo-file",
  "web-sys",
  "js-sys",
  "wasm-bindgen",
  "wasm-bindgen-futures",
  "serde-wasm-bindgen",
  "getrandom",
  "serde_json",
  "purr-wasm",
]

# Desktop feature includes desktop-specific functionality and transcription
desktop = [
  "dioxus/desktop",
  "tokio/full",
  "purr-core",
  "rfd",
  "cached",
  "serde_json",
  "chrono",
  "directories",
  "toml",
  "toml_edit",
]

# Mobile feature
mobile = ["dioxus/mobile"]

vulkan = ["purr-core/vulkan"]
cuda = ["purr-core/cuda"]
metal = ["purr-core/metal"]
coreml = ["purr-core/coreml"]
static-ffmpeg = ["purr-core/static-ffmpeg"]
gloo-timers = ["dep:gloo-timers"]

[dev-dependencies]
rstest = "0.28"
pretty_assertions = "1.4.1"
tempfile = "3.21"
wasm-bindgen-test = "0.3"

[lints]
workspace = true

[build-dependencies]
purr-delayload = { version = "0.1.0", path = "../purr-delayload" }
