[package]
name = "purr-web"
version = "0.1.0"
edition = "2021"
description = "Web platform implementation for Purr transcription engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core dependencies
purr-common = { path = "../purr-common" }
tokio = { version = "1.0", features = ["sync", "time", "rt", "macros"] }
futures = "0.3"
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.5.0", features = ["v4", "serde", "js"] }
thiserror = "1.0"
miette = { version = "7.0", features = ["fancy"] }
tracing = "0.1"

# WASM-specific dependencies
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
async-trait = "0.1"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "File",
  "FileReader",
  "Blob",
  "Response",
  "Request",
  "RequestInit",
  "RequestMode",
  "Headers",
  "Storage",
  "Worker",
  "MessageEvent",
  "ErrorEvent",
  "DedicatedWorkerGlobalScope",
  "WorkerGlobalScope",
  # IndexedDB support
  "IdbFactory",
  "IdbDatabase",
  "IdbTransaction",
  "IdbObjectStore",
  "IdbRequest",
  "IdbCursor",
  "IdbKeyRange",
  "IdbVersionChangeEvent",
  # WebGPU support
  "Navigator",
  "Gpu",
  "GpuAdapter",
  "GpuDevice",
  "GpuBuffer",
  "GpuBufferDescriptor",
  "gpu_buffer_usage",
  "GpuCommandEncoder",
  "GpuQueue",
  # OPFS support
  "StorageManager",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemWritableFileStream",
  # Streaming support
  "ReadableStream",
  "WritableStream",
  "TransformStream",
  "ReadableStreamDefaultReader",
  # Web Audio API support
  "AudioContext",
  "AudioBuffer",
  "AudioWorkletNode",
  "OfflineAudioContext",
  "AudioContextState",
  "AudioNode",
  "AudioParam",
  "AudioProcessingEvent",
  "BaseAudioContext",
] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
serde-wasm-bindgen = "0.6"

# Real browser API dependencies
indexed_db_futures = "0.4"
gloo-file = "0.3"
gloo-net = "0.5"
tokio-stream = { version = "0.1", features = ["sync"] }
scc = "3.0.7"

[dependencies.getrandom]
version = "0.2"
features = ["js"]

# Removed console_error_panic_hook - let Dioxus handle panic management
[features]
default = []

[dev-dependencies]
rstest = "0.26"
pretty_assertions = "1.4.1"
tempfile = "3.21"
wasm-bindgen-test = "0.3"

# Profiles are handled at workspace level