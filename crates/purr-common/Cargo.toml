[package]
name = "purr-common"
version = "0.1.0"
edition = "2024"

[dependencies]
ambassador = "0.4.2"
async-trait = "0.1.89"
bytes = { version = "1.10.1", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"], optional = true }
const-str = { version = "0.7.0", features = ["all"] }
futures = "0.3.31"
miette = "7.6.0"
paste = "1.0.15"
phf = { version = "0.13.1", features = ["macros"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.16"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "5.0"

[target.'cfg(all(target_arch = "wasm32", feature = "web"))'.dependencies]
web-sys = { version = "0.3", features = ["Window", "MediaQueryList"] }

[dev-dependencies]
rstest = "0.26"
pretty_assertions = "1.4.1"
tempfile = "3.21"

[features]
default = []
clap = ["dep:clap"]
web = []
