[package]
name = "purr-common"
version.workspace = true
edition = "2024"

[dependencies]
ambassador = "0.5.1"
bytes = { version = "1.10.1", features = ["serde"] }
const-str = { version = "1.1.0", features = ["all"] }
futures = "0.3.31"
hex = "0.4.3"
miette = "7.6.0"
serde = { version = "1.0.225", features = ["derive", "rc"] }
serde_json = "1.0"
serde_with = "3.24.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.16"

[dev-dependencies]
rstest = "0.28"
pretty_assertions = "1.4.1"
tempfile = "3.21"
toml = "1.2"

[features]
default = []

[lints]
workspace = true
