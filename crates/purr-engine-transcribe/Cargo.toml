[package]
name = "purr-engine-transcribe"
edition = "2024"
version.workspace = true
description = "transcribe.cpp as a Purr speech recognition engine"

[dependencies]
parking_lot = "0.13.0"
purr-common = { version = "0.1.0", path = "../purr-common" }
purr-core = { version = "0.1.0", path = "../purr-core" }
oopsie = { workspace = true }
tracing = "0.1.41"
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["dynamic-backends"] }

[features]
cuda = ["transcribe-cpp/cuda", "purr-core/cuda"]
vulkan = ["transcribe-cpp/vulkan", "purr-core/vulkan"]
metal = ["transcribe-cpp/metal"]

[lints]
workspace = true

[build-dependencies]
purr-delayload = { version = "0.1.0", path = "../purr-delayload" }

[dev-dependencies]
futures = "0.3.34"
pretty_assertions = "1.4.1"
rstest = "0.28"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
