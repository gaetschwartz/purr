[package]
name = "purr-onnx-convert"
version.workspace = true
edition = "2024"
description = "Streaming ONNX rewrite: external-data split and tied-embedding fix, small enough to run in a browser worker"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
half = "2.7.1"
hex = { version = "0.4.3", optional = true }
oopsie.workspace = true
protobuf = "3.7.2"
sha2 = { version = "0.11.1", optional = true }
ureq = { version = "3.5.2", optional = true }

[build-dependencies]
protobuf-codegen = "3.7.2"

[features]
tooling = ["dep:ureq", "dep:sha2", "dep:hex"]

[[test]]
name = "real_model_conversion"
required-features = ["tooling"]

[dev-dependencies]
purr-common = { path = "../purr-common" }
