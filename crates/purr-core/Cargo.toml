[package]
name = "purr-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Whisper.cpp bindings
whisper-rs = { version = "0.15.0", default-features = false, features = [
  "tracing_backend",
  "raw-api",
] }
ffmpeg-next = { version = "8.0", features = ["codec", "format"] }

# FFmpeg bindings for audio processing
# Async runtime
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# XDG directory support
directories = "6.0"

# HTTP client for model downloading
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
strum = { version = "0.27.2", features = ["derive"] }
tokio-stream = "0.1.17"
miette = { version = "7.6.0", features = ["fancy"] }
serde_with = "3.14.1"
bytes = "1.10.1"
url = "2.5"

[dev-dependencies]
tempfile = "3.21"
rstest = "0.26"
pretty_assertions = "1.4.1"
axum = "0.8"
axum-test = "18.1"
tower = "0.5"
tokio-util = { version = "0.7", features = ["io"] }

[features]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]

[build-dependencies]
build-target = "0.8.0"
