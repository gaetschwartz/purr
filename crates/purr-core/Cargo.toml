[package]
name = "purr-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# Whisper.cpp bindings
whisper-rs = { version = "0.16.0", default-features = false, features = [
  "tracing_backend",
  "raw-api",
] }
ffmpeg-next = { version = "9.0", features = ["codec", "format", "software-resampling"], default-features = false }

# FFmpeg bindings for audio processing
# Async runtime
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# XDG directory support
directories = "6.0"

# HTTP client for model downloading
reqwest = { version = "0.13", features = ["charset", "http2", "rustls-no-provider", "stream", "system-proxy"], default-features = false }
futures-util = "0.3"
strum = { version = "0.28.0", features = ["derive"] }
tokio-stream = "0.1.17"
miette = { version = "7.6.0", features = ["fancy"] }
serde_with = "3.14.1"
bytes = "1.10.1"
url = "2.5"
sha2 = "0.10.9"
hex = "0.4.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
purr-common = { version = "0.1.0", path = "../purr-common" }
parking_lot = "0.13.0"
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std"] }

[dev-dependencies]
tempfile = "3.21"
rstest = "0.28"
pretty_assertions = "1.4.1"
axum = "0.8"
axum-test = "21.1"
tower = "0.5"
tokio-util = { version = "0.7", features = ["io"] }

[features]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]
coreml = ["whisper-rs/coreml"]
static-ffmpeg = ["ffmpeg-next/static"]

[build-dependencies]
build-target = "0.8.0"
purr-delayload = { version = "0.1.0", path = "../purr-delayload" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
