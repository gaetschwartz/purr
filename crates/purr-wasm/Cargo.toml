[package]
name = "purr-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly platform implementation for Purr transcription engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
purr-common = { path = "../purr-common" }
tokio = { version = "1.0", default-features = false, features = ["sync", "time", "rt", "macros"] }
futures = "0.3"
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.5.0", features = ["v4", "serde", "js"] }
thiserror = "2.0"
miette = { version = "7.0", features = ["fancy"] }
tracing = "0.1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Navigator",
  "Gpu",
  "GpuAdapter",
  "GpuAdapterInfo",
  "GpuSupportedFeatures",
  "Cache",
  "CacheStorage",
  "Response",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Storage",
  "DomException",
  "Worker",
  "WorkerOptions",
  "WorkerType",
  "MessageEvent",
  "ErrorEvent",
  "IdbFactory",
  "IdbDatabase",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbObjectStore",
  "IdbRequest",
  "IdbOpenDbRequest",
  "IdbVersionChangeEvent",
  "Event",
  "DomStringList",
  "AudioBuffer",
  "BaseAudioContext",
  "OfflineAudioContext",
] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-wasm = "0.2.1"
console_error_panic_hook = "0.1.7"
tracing-subscriber = "0.3.20"
manganis = "0.8.0-alpha.3"
sha2 = "0.11.1"
hex = "0.4.3"

[dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[features]
default = []

[lints]
workspace = true
