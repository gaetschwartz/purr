[package]
name = "purr-test-utils"
version = "0.1.0"
edition = "2021"
description = "Shared test utilities and fixtures for the Purr workspace"

[dependencies]
# Core dependencies
purr-common = { path = "../purr-common" }
purr-core = { path = "../purr-core", optional = true }
purr-web = { path = "../purr-web", optional = true }

# Test framework dependencies
tokio = { version = "1.47", features = ["full", "test-util"] }
tokio-test = "0.4"
futures = "0.3"
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.5.0", features = ["v4"] }
tempfile = "3.21"

# Testing utilities
rstest = "0.26"
pretty_assertions = "1.4.1"
mockall = { version = "0.13", optional = true }
proptest = "1.5"
proptest-derive = "0.5"
fake = { version = "2.10", features = ["derive"] }
quickcheck = "1.0"
quickcheck_macros = "1.0"

# WASM testing
wasm-bindgen-test = { version = "0.3", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "console",
  "Gpu",
  "GpuAdapter",
  "GpuDevice",
  "GpuBuffer",
  "GpuQueue",
  "AudioContext",
  "Window"
] }

# WebGPU testing support
wgpu = { version = "23.0", features = ["webgl"], optional = true }

# Async and timing utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2"
criterion = { version = "0.5", features = ["html_reports"], optional = true }

# Additional random dependencies for testing
rand = { version = "0.8", features = ["small_rng"] }

[features]
default = ["core", "mocks"]
core = ["purr-core"]
web = ["purr-web", "wasm-bindgen-test", "js-sys", "web-sys", "wgpu"]
benchmarks = ["dep:criterion"]
mocks = ["dep:mockall"]

[lib]
name = "purr_test_utils"
path = "src/lib.rs"