[package]
name = "purr-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core library
purr-core.workspace = true
purr-common = { path = "../purr-common", features = ["clap"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"

# Serialization for output
serde_json = "1.0"

# Logging
tracing = "0.1.41"

# Progress bars
indicatif = "0.18"

# Colored output
owo-colors = "4.2.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-core = "0.1.34"
num_cpus = "1.17.0"
konst = { version = "0.4.1", features = ["alloc"] }
const-str = { version = "0.7.0", features = ["proc"] }
shadow-rs = { version = "1.3.0", default-features = false }
miette = { version = "7.6.0", features = ["fancy"] }
test-with = "0.15.4"
paste = { package = "pastey", version = "*" }
phf = { version = "0.13.1", features = ["macros"] }

[dev-dependencies]
tempfile = "3.21"
assert_cmd = "2.0"
rstest = "0.26"
pretty_assertions = "1.4.1"
strum = { version = "0.27.2", features = ["derive"] }

[features]
cuda = ["purr-core/cuda"]
vulkan = ["purr-core/vulkan"]
metal = ["purr-core/metal"]
coreml = ["purr-core/coreml"]

[build-dependencies]
shadow-rs = "1.3.0"
