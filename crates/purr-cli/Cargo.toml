[package]
name = "purr-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "purr"
path = "src/main.rs"

[dependencies]
# Core library
purr-core.workspace = true
purr-engine-whisper = { path = "../purr-engine-whisper" }
purr-common = { path = "../purr-common" }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.47", features = ["full"] }
futures = "0.3"

# Serialization for output
serde_json = "1.0"

# Logging
tracing = "0.1.41"

# Progress bars
indicatif = "0.18"

# Colored output
owo-colors = "4.2.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-core = "0.1.34"
konst = { version = "0.4.1", features = ["alloc"] }
const-str = { version = "1.1.0", features = ["proc"] }
shadow-rs = { version = "2.0.0", default-features = false }
oopsie = { workspace = true, features = ["fancy"] }
paste = { package = "pastey", version = "0.2" }
phf = { version = "0.14.0", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
purr-engine-transcribe = { version = "0.1.0", path = "../purr-engine-transcribe", optional = true }
glob = "0.3.4"
strfmt = "0.2.6"
url = "2.5"
percent-encoding = "2.3.2"
humantime = "2.4.0"

[dev-dependencies]
tempfile = "3.21"
assert_cmd = "2.0"
rstest = "0.28"
pretty_assertions = "1.4.1"
strum = { version = "0.28.0", features = ["derive"] }
parking_lot = "0.13.0"
purr-golden = { path = "../purr-golden" }
axum = "0.8"

[features]
cuda = ["purr-engine-whisper/cuda", "purr-engine-transcribe?/cuda"]
vulkan = ["purr-engine-whisper/vulkan", "purr-engine-transcribe?/vulkan"]
metal = ["purr-engine-whisper/metal", "purr-engine-transcribe?/metal"]
coreml = ["purr-engine-whisper/coreml"]
static-ffmpeg = ["purr-core/static-ffmpeg"]
transcribe = ["dep:purr-engine-transcribe"]

[build-dependencies]
purr-delayload = { path = "../purr-delayload" }
shadow-rs = "2.0.0"

[lints]
workspace = true
