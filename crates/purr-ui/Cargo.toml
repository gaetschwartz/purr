[package]
name = "purr-ui"
version = "0.1.0"
authors = ["Gaëtan S. <>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
purr-core = { path = "../purr-core", optional = true }
dioxus = { version = "0.7.0-rc.0", features = ["router", "fullstack"] }
dioxus-fullstack = { version = "0.7.0-rc.0", features = ["axum"] }
rfd = { version = "0.15.4", features = ["tokio"] }
futures = { version = "0.3.31", default-features = false, features = [
  "async-await",
  "alloc",
  "std",
] }
serde = { version = "1.0.225", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"], optional = true }
bytes = "1.10.1"

[features]
default = ["desktop"]
server = ["dioxus/server", "tokio", "purr-core"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
