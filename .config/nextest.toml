[profile.default]
default-filter = "not (test(*slow_*))"

[profile.all]
default-filter = "all()"

# Profile for running only slow integration tests that require full transcription
[profile.slow]
default-filter = "test(slow_)"

# Test timeout configuration for slow transcription tests
[[profile.all.overrides]]
filter = "test(slow_)"
slow-timeout = { period = "600s", grace-period = "30s" }

[[profile.slow.overrides]]
filter = "test(slow_)"
slow-timeout = { period = "600s", grace-period = "30s" }
